<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tafs</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header><span class="mark">tafs</span><span id="conn" class="conn"></span></header>

    <section id="pair" hidden>
      <h1 data-m="pair_title"></h1>
      <p data-m="pair_body"></p>
      <p class="note" data-m="pair_profile"></p>
      <form id="pairForm">
        <label for="code" data-m="pair_code_label"></label>
        <input id="code" autocomplete="off" spellcheck="false" maxlength="40" inputmode="text" />
        <button type="submit" data-m="pair_button"></button>
      </form>
      <p id="pairStatus" class="status" role="status"></p>
    </section>

    <section id="paired" hidden>
      <h1 id="pairedName"></h1>
      <p data-m="paired_body"></p>
      <div id="tafView">
      <nav id="atWork" class="atwork" hidden>
        <span class="note" data-m="at_work"></span>
        <span id="atWorkList"></span>
      </nav>
      <section id="taf">
        <label id="tafPickRow" class="pick" hidden><span data-m="taf_choose"></span> <select id="tafPick"></select></label>
        <h2 id="tafName"></h2>
        <ol id="tafThread" class="thread"></ol>
        <p id="tafPhone" class="note" data-m="approve_on_phone" hidden></p>
        <p id="tafNote" class="note"></p>
        <form id="tafForm" hidden>
          <textarea id="tafWords" rows="3" maxlength="2000"></textarea>
          <div class="buttons">
            <button type="submit" data-m="coach_send"></button>
          </div>
        </form>
        <p id="noTaf" class="note" data-m="no_taf_here" hidden></p>
        <div id="tafRemove" hidden>
          <button type="button" id="tafRemoveBtn" class="quiet" data-m="taf_remove"></button>
          <p id="tafRemoveWhy" class="note" data-m="taf_remove_on_phone" hidden></p>
        </div>
      </section>
      <button type="button" id="setupTaf" class="quiet" data-m="setup_taf"></button>
      </div>
      <section id="coach" hidden>
        <div class="viewhead">
          <button type="button" id="coachBack" class="quiet" data-m="coach_back"></button>
          <h2 data-m="coach_title"></h2>
        </div>
        <div class="buttons">
          <button type="button" id="coachNew" data-m="coach_new"></button>
        </div>
        <h3 data-m="coach_previous"></h3>
        <p id="coachPastNote" class="note" hidden></p>
        <ul id="coachChats" class="chats"></ul>
        <details id="coachArchived">
          <summary data-m="coach_archived"></summary>
          <p class="note" data-m="coach_archived_body"></p>
          <p id="coachArchivedNote" class="note" hidden></p>
          <ul id="coachArchivedChats" class="chats"></ul>
        </details>
        <h3 id="coachOpen" hidden></h3>
        <div id="coachEmpty" hidden>
          <p><strong data-m="coach_empty_title"></strong></p>
          <p class="note" data-m="coach_empty_body_reads"></p>
        </div>
        <ol id="coachThread" class="thread"></ol>
        <p id="coachPhone" class="note" data-m="approve_on_phone" hidden></p>
        <p id="coachNote" class="note"></p>
        <p id="coachReads" class="note" hidden><span id="coachReadsWords"></span> <button type="button" id="coachReadsSwitch" class="quiet small" hidden></button> <button type="button" id="pageConsentStop" class="quiet small" data-m="page_consent_withdraw" hidden></button></p>
        <p id="pageConsentOff" class="note" hidden><span data-m="page_consent_off"></span> <button type="button" id="pageConsentOpen" class="quiet small" data-m="page_consent_turn_on"></button></p>
        <section id="pageConsent" class="card" hidden>
          <p><strong data-m="page_consent_title"></strong></p>
          <ul>
            <li data-m="page_consent_what"></li>
            <li data-m="page_consent_when"></li>
            <li data-m="page_consent_never"></li>
            <li data-m="page_consent_change"></li>
          </ul>
          <div class="buttons">
            <button type="button" id="pageConsentAllow" data-m="page_consent_allow"></button>
            <button type="button" id="pageConsentNotNow" class="quiet" data-m="page_consent_not_now"></button>
          </div>
        </section>
        <form id="coachForm">
          <textarea id="coachWords" rows="3" maxlength="2000" data-m-placeholder="coach_placeholder"></textarea>
          <div class="buttons">
            <button type="submit" data-m="coach_send"></button>
            <button type="button" id="coachSendAlone" class="quiet" data-m="coach_send_alone" hidden></button>
          </div>
        </form>
      </section>
      <div id="runs"></div>
      <p id="idle" class="note" data-m="idle"></p>
      <button id="unpair" class="quiet" data-m="unpair"></button>
    </section>

    <template id="runTemplate">
      <article class="run">
        <h2 class="taf"></h2>
        <p class="where"></p>
        <p class="paused" hidden></p>
        <section class="hand" hidden>
          <h3 data-m="hand_title"></h3>
          <p class="note"><span data-m="hand_says"></span></p>
          <blockquote class="handWords"></blockquote>
          <p class="note" data-m="hand_careful"></p>
          <p class="note handShown" hidden></p>
          <div class="buttons">
            <button type="button" class="handShow quiet" data-m="hand_show"></button>
            <button type="button" class="handDone" data-m="hand_done"></button>
            <button type="button" class="handNo quiet" data-m="hand_declined"></button>
          </div>
        </section>
        <ol class="steps"></ol>
        <div class="buttons">
          <button class="pause" data-m="pause"></button>
          <button class="resume" data-m="resume" hidden></button>
          <button class="stop" data-m="stop"></button>
        </div>
      </article>
    </template>

    <script type="module" src="panel.js"></script>
  </body>
</html>
