name: Tafs
options:
  bundleIdPrefix: bot.tafs
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # No runtime main-actor checks (Swift 6 adds them at every main-actor closure's entry).
    # On iPadOS 27, SwiftUI builds lazy content (a sheet's, a navigation destination's) on
    # its async render thread: the check trapped there and crashed builds 772, 789 and 793
    # (EXC_BREAKPOINT in LazyView.body). The compiler's isolation checking stays on.
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-dynamic-actor-isolation"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # The Mac (macOS 13 and later, docs/mac-app.md): the same app built with Mac Catalyst,
    # in the iPad's layout. The bundle ids stay the iPhone's and iPad's, with no "maccatalyst." prefix.
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
# A KIFF receipt is checked on the device (kiff/tafs#167): recovering its signer needs
# secp256k1, which CryptoKit doesn't have. Pinned to an exact release; only its C library
# is used, since P256K's recovery initializer stops the app on a bad signature.
packages:
  swift-secp256k1:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    exactVersion: 0.24.0
targets:
  Tafs:
    type: application
    platform: iOS
    sources: [Tafs, Shared]
    dependencies:
      # iPhone and iPad only: a Mac has no lock screen Live Activity to draw.
      - target: TafsWidgets
        platformFilter: iOS
      # Fills in a hold's notification from KIFF (kiff/tafs#210).
      - target: TafsNotify
      - package: swift-secp256k1
        product: libsecp256k1
    info:
      path: Tafs/Info.plist
      properties:
        CFBundleDisplayName: tafs
        # From the build settings, so CI's build number reaches App Store Connect.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad (kiff/tafs#85): every orientation, which iPad multitasking requires.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: tafs asks for Face ID before an approval is signed and sent.
        # Dictation (kiff/tafs#208): recognized on the device, no audio leaves the phone.
        NSMicrophoneUsageDescription: tafs turns your voice into text on this device. Your voice isn't sent anywhere.
        NSSpeechRecognitionUsageDescription: tafs turns your voice into text on this device. Your voice isn't sent anywhere.
        # Attachments (kiff/tafs#209): a photo taken for a message goes only with that message.
        NSCameraUsageDescription: tafs takes a photo to attach to your message. It goes only with that message, to your own chat.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # A silent push says a held call was answered elsewhere, so its alert goes.
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: bot.tafs.app
            CFBundleURLSchemes: [tafs]
        # Names Siri hears for the app besides "tafs", which it often mishears, so "Stop my
        # agents" reaches Halt all (kiff/tafs#236, item 28). iOS takes three at most.
        INAlternativeAppNames:
          - INAlternativeAppName: my agents
          - INAlternativeAppName: mis agentes
          - INAlternativeAppName: mes agents
    # Push: Xcode's builds use Apple's sandbox, TestFlight and the App Store production.
    entitlements:
      path: Tafs/Tafs.entitlements
      properties:
        aps-environment: $(TAFS_APS_ENVIRONMENT)
        # A hold and a halt come through a Focus (kiff/tafs#210).
        com.apple.developer.usernotifications.time-sensitive: true
        # The app's own Keychain group, named so the notification extension shares it: the
        # app's items stay where they are, since this is the group it used by default.
        keychain-access-groups:
          - $(AppIdentifierPrefix)bot.tafs.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.tafs.app
        # Set by CI for a manually signed TestFlight build; empty otherwise.
        PROVISIONING_PROFILE_SPECIFIER: $(TAFS_PROFILE_APP)
        # iPhone and iPad (kiff/tafs#85).
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          TAFS_APS_ENVIRONMENT: development
        Release:
          TAFS_APS_ENVIRONMENT: production
  TafsWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    # The widget gets its own small mascot (TafsWidgets/WidgetAssets): a Live Activity
    # shows a gray placeholder in place of an image over its size budget.
    sources:
      - TafsWidgets
      - path: Shared
        excludes: [Mascot.xcassets]
    info:
      path: TafsWidgets/Info.plist
      properties:
        CFBundleDisplayName: tafs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.tafs.app.widgets
        # Not built for the Mac (the app's dependency on it is iPhone and iPad only).
        SUPPORTS_MACCATALYST: NO
        PROVISIONING_PROFILE_SPECIFIER: $(TAFS_PROFILE_WIDGETS)
        # As the app: an extension supports every device its app does.
        TARGETED_DEVICE_FAMILY: "1,2"
  # Fills in a hold's notification before it shows (kiff/tafs#210): the taf, the amount
  # and the deadline, read from KIFF with the app's session, in the app's own words.
  TafsNotify:
    type: app-extension
    platform: iOS
    sources:
      - Notify
      - Tafs/KIFF
      - path: Tafs/Model
        excludes: [SetupShape.swift]
      - Tafs/Services/HoldNotification.swift
      # The lost-key words name this device's Face ID or Touch ID (KIFFClient.approvalKeyLost).
      - Tafs/Services/BiometryName.swift
      # The app's words: Model and KIFF read them, and the extension's own bundle needs the catalog.
      - Tafs/Design/Words.swift
      - Tafs/Localizable.xcstrings
    dependencies:
      - package: swift-secp256k1
        product: libsecp256k1
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: tafs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Notify/TafsNotify.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)bot.tafs.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.tafs.app.notify
        PROVISIONING_PROFILE_SPECIFIER: $(TAFS_PROFILE_NOTIFY)
        TARGETED_DEVICE_FAMILY: "1,2"
  TafsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TafsTests
      # The App Store's products for StoreKit's local testing (StoreKitLocalTests).
      - path: Tafs.storekit
        buildPhase: resources
    dependencies:
      - target: Tafs
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # The owner's 845 test, pinned on a simulator: a sent message at the top at once, and the
  # work block under it (kiff/tafs#289).
  TafsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TafsUITests
    dependencies:
      - target: Tafs
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tafs
schemes:
  Tafs:
    build:
      targets:
        Tafs: all
        TafsTests: [test]
        TafsUITests: [test]
    # Run from Xcode, the App Store's products are this file's: Solo and the five packs,
    # with the same product ids as App Store Connect.
    run:
      storeKitConfiguration: Tafs.storekit
    test:
      targets: [TafsTests, TafsUITests]
      # StoreKit's local testing (StoreKitLocalTests): the test host's App Store is this file's.
      storeKitConfiguration: Tafs.storekit
