name: Tafs
options:
  bundleIdPrefix: bot.tafs
  deploymentTarget:
    iOS: "16.0"
    macOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
# A KIFF receipt is checked on the device (kiff/tafs#167): recovering its signer needs
# secp256k1, which CryptoKit doesn't have. Pinned to an exact release; only its C library
# is used, since P256K's recovery initializer stops the app on a bad signature.
packages:
  swift-secp256k1:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    exactVersion: 0.24.0
targets:
  Tafs:
    type: application
    platform: iOS
    sources: [Tafs, Shared]
    dependencies:
      - target: TafsWidgets
      # Fills in a hold's notification from KIFF (kiff/tafs#210).
      - target: TafsNotify
      - package: swift-secp256k1
        product: libsecp256k1
    info:
      path: Tafs/Info.plist
      properties:
        CFBundleDisplayName: tafs
        # From the build settings, so CI's build number reaches App Store Connect.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad (kiff/tafs#85): every orientation, which iPad multitasking requires.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
        NSFaceIDUsageDescription: tafs asks for Face ID before an approval is signed and sent.
        # Dictation (kiff/tafs#208): recognized on the device, no audio leaves the phone.
        NSMicrophoneUsageDescription: tafs turns your voice into text on this device. Your voice isn't sent anywhere.
        NSSpeechRecognitionUsageDescription: tafs turns your voice into text on this device. Your voice isn't sent anywhere.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # A silent push says a held call was answered elsewhere, so its alert goes.
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: bot.tafs.app
            CFBundleURLSchemes: [tafs]
    # Push: Xcode's builds use Apple's sandbox, TestFlight and the App Store production.
    entitlements:
      path: Tafs/Tafs.entitlements
      properties:
        aps-environment: $(TAFS_APS_ENVIRONMENT)
        # A hold and a halt come through a Focus (kiff/tafs#210).
        com.apple.developer.usernotifications.time-sensitive: true
        # The app's own Keychain group, named so the notification extension shares it: the
        # app's items stay where they are, since this is the group it used by default.
        keychain-access-groups:
          - $(AppIdentifierPrefix)bot.tafs.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.tafs.app
        # Set by CI for a manually signed TestFlight build; empty otherwise.
        PROVISIONING_PROFILE_SPECIFIER: $(TAFS_PROFILE_APP)
        # iPhone and iPad (kiff/tafs#85).
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          TAFS_APS_ENVIRONMENT: development
        Release:
          TAFS_APS_ENVIRONMENT: production
  TafsWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    # The widget gets its own small mascot (TafsWidgets/WidgetAssets): a Live Activity
    # shows a gray placeholder in place of an image over its size budget.
    sources:
      - TafsWidgets
      - path: Shared
        excludes: [Mascot.xcassets]
    info:
      path: TafsWidgets/Info.plist
      properties:
        CFBundleDisplayName: tafs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.tafs.app.widgets
        PROVISIONING_PROFILE_SPECIFIER: $(TAFS_PROFILE_WIDGETS)
        # As the app: an extension supports every device its app does.
        TARGETED_DEVICE_FAMILY: "1,2"
  # Fills in a hold's notification before it shows (kiff/tafs#210): the taf, the amount
  # and the deadline, read from KIFF with the app's session, in the app's own words.
  TafsNotify:
    type: app-extension
    platform: iOS
    sources:
      - Notify
      - Tafs/KIFF
      - path: Tafs/Model
        excludes: [SetupShape.swift]
      - Tafs/Services/HoldNotification.swift
    dependencies:
      - package: swift-secp256k1
        product: libsecp256k1
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: tafs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Notify/TafsNotify.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)bot.tafs.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.tafs.app.notify
        PROVISIONING_PROFILE_SPECIFIER: $(TAFS_PROFILE_NOTIFY)
        TARGETED_DEVICE_FAMILY: "1,2"
  # The Mac app (kiff/tafs#85): native SwiftUI on macOS 12, the owner's Mac's last system.
  # The model, clients and services are the iPhone app's; its window is its own (Mac/).
  # Never above 12.0, and never a software signing key: a Mac without a Secure Enclave
  # approves on the iPhone.
  TafsMac:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    # The shared KIFF sources check receipts too.
    dependencies:
      - package: swift-secp256k1
        product: libsecp256k1
    sources:
      - path: Mac
        excludes: [Info.plist, TafsMac.entitlements, make-icon.swift]
      - path: Tafs
        excludes:
          - App/TafsApp.swift
          # The iPhone's home, sign-in and new-taf flows: the Mac has its own window, and
          # starting a taf needs a signature, given on the iPhone.
          - Views/HomeView.swift
          - Views/HomeSplitView.swift
          - Views/SignInView.swift
          - Views/OnboardingView.swift
          - Views/NewTafFlow.swift
          # Coach mode's button, panel and sheet: the iPhone's and iPad's (kiff/tafs#138).
          - Views/CoachMode.swift
          - Services/LockScreen.swift
          - Services/PushDelegate.swift
          - Info.plist
          # The Mac's own manifest is Mac/PrivacyInfo.xcprivacy.
          - PrivacyInfo.xcprivacy
      - path: Shared
        excludes: [HeldActivity.swift]
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: tafs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: bot.tafs.app
            CFBundleURLSchemes: [tafs]
    entitlements:
      path: Mac/TafsMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.tafs.app
        # The Mac's own icon sizes, and tafs' amber where macOS draws its accent (kiff/tafs#85).
        ASSETCATALOG_COMPILER_APPICON_NAME: MacAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  TafsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TafsTests
      # The App Store's products for StoreKit's local testing (StoreKitLocalTests).
      - path: Tafs.storekit
        buildPhase: resources
    dependencies:
      - target: Tafs
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tafs:
    build:
      targets:
        Tafs: all
        TafsTests: [test]
    # Run from Xcode, the App Store's products are this file's: Solo and the five packs,
    # with the same product ids as App Store Connect.
    run:
      storeKitConfiguration: Tafs.storekit
    test:
      targets: [TafsTests]
      # StoreKit's local testing (StoreKitLocalTests): the test host's App Store is this file's.
      storeKitConfiguration: Tafs.storekit
  TafsMac:
    build:
      targets:
        TafsMac: all
