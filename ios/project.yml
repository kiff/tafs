name: Tafs
# The watch app embedded in the iPhone app: only for TestFlight (the testflight job sets
# TAFS_EMBED_WATCH), see watch-embed.yml.
include:
  - path: watch-embed.yml
    enable: ${TAFS_EMBED_WATCH}
options:
  bundleIdPrefix: bot.tafs
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # No runtime main-actor checks (Swift 6 adds them at every main-actor closure's entry).
    # On iPadOS 27, SwiftUI builds lazy content (a sheet's, a navigation destination's) on
    # its async render thread: the check trapped there and crashed builds 772, 789 and 793
    # (EXC_BREAKPOINT in LazyView.body). The compiler's isolation checking stays on.
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-dynamic-actor-isolation"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # The Mac (macOS 13 and later, docs/mac-app.md): the same app built with Mac Catalyst,
    # in the iPad's layout. The bundle ids stay the iPhone's and iPad's, with no "maccatalyst." prefix.
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
# A KIFF receipt is checked on the device (kiff/tafs#167): recovering its signer needs
# secp256k1, which CryptoKit doesn't have. Pinned to an exact release; only its C library
# is used, since P256K's recovery initializer stops the app on a bad signature.
packages:
  swift-secp256k1:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    exactVersion: 0.24.0
targets:
  Tafs:
    type: application
    platform: iOS
    # WatchShared: what the watch asks and the phone answers (docs/watch-app.md).
    sources: [Tafs, Shared, WatchShared]
    dependencies:
      # iPhone and iPad only: a Mac has no lock screen Live Activity to draw.
      - target: TafsWidgets
        platformFilter: iOS
      # Fills in a hold's notification from KIFF (kiff/tafs#210).
      - target: TafsNotify
      - package: swift-secp256k1
        product: libsecp256k1
    info:
      path: Tafs/Info.plist
      properties:
        CFBundleDisplayName: tafs
        # The Mac's menu bar and its app menu ("About tafs", "Quit tafs") read the bundle's
        # name, which is otherwise the target's, "Tafs". iPhone and iPad show the display name.
        CFBundleName: tafs
        # From the build settings, so CI's build number reaches App Store Connect.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad (kiff/tafs#85): every orientation, which iPad multitasking requires.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: tafs asks for Face ID before an approval is signed and sent.
        # Dictation (kiff/tafs#208): recognized on the device, no audio leaves the phone.
        NSMicrophoneUsageDescription: tafs turns your voice into text on this device. Your voice isn't sent anywhere.
        NSSpeechRecognitionUsageDescription: tafs turns your voice into text on this device. Your voice isn't sent anywhere.
        # Attachments (kiff/tafs#209): a photo taken for a message goes only with that message.
        NSCameraUsageDescription: tafs takes a photo to attach to your message, or reads the code your computer shows to pair it. A photo goes only with that message, to your own chat.
        ITSAppUsesNonExemptEncryption: false
        # The Mac App Store requires a Mac app's category in its Info.plist; iOS ignores it.
        # It should match the App Store listing's primary category (docs/mac-app.md).
        LSApplicationCategoryType: public.app-category.business
        NSSupportsLiveActivities: true
        # A silent push says a held call was answered elsewhere, so its alert goes.
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: bot.tafs.app
            CFBundleURLSchemes: [tafs]
        # Names Siri hears for the app besides "tafs", which it often mishears, so "Stop my
        # agents" reaches Halt all (kiff/tafs#236, item 28). iOS takes three at most.
        INAlternativeAppNames:
          - INAlternativeAppName: my agents
          - INAlternativeAppName: mis agentes
          - INAlternativeAppName: mes agents
    # Push: Xcode's builds use Apple's sandbox, TestFlight and the App Store production.
    entitlements:
      path: Tafs/Tafs.entitlements
      properties:
        aps-environment: $(TAFS_APS_ENVIRONMENT)
        # A hold and a halt come through a Focus (kiff/tafs#210).
        com.apple.developer.usernotifications.time-sensitive: true
        # The app's own Keychain group, named so the notification extension shares it: the
        # app's items stay where they are, since this is the group it used by default.
        keychain-access-groups:
          - $(AppIdentifierPrefix)bot.tafs.app
        # kiff.dev vouches for the app (its apple-app-site-association lists R54YWFRK4B.bot.tafs.app),
        # so a passkey made or used here is kiff.dev's, with the origin KIFF accepts (`https://kiff.dev`).
        com.apple.developer.associated-domains:
          - webcredentials:kiff.dev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.tafs.app
        # The Mac build's own entitlements: push by its Mac name, and the App Sandbox
        # (docs/mac-app.md, "Signing and the sandbox").
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Tafs/TafsMac.entitlements
        # Set by CI for a manually signed TestFlight build; empty otherwise.
        PROVISIONING_PROFILE_SPECIFIER: $(TAFS_PROFILE_APP)
        # iPhone and iPad (kiff/tafs#85).
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          TAFS_APS_ENVIRONMENT: development
        Release:
          TAFS_APS_ENVIRONMENT: production
  TafsWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    # The widget gets its own small mascot (TafsWidgets/WidgetAssets): a Live Activity
    # shows a gray placeholder in place of an image over its size budget.
    sources:
      - TafsWidgets
      - path: Shared
        excludes: [Mascot.xcassets]
    info:
      path: TafsWidgets/Info.plist
      properties:
        CFBundleDisplayName: tafs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.tafs.app.widgets
        # Not built for the Mac (the app's dependency on it is iPhone and iPad only).
        SUPPORTS_MACCATALYST: NO
        PROVISIONING_PROFILE_SPECIFIER: $(TAFS_PROFILE_WIDGETS)
        # As the app: an extension supports every device its app does.
        TARGETED_DEVICE_FAMILY: "1,2"
  # Fills in a hold's notification before it shows (kiff/tafs#210): the taf, the amount
  # and the deadline, read from KIFF with the app's session, in the app's own words.
  TafsNotify:
    type: app-extension
    platform: iOS
    sources:
      - Notify
      - Tafs/KIFF
      - path: Tafs/Model
        excludes: [SetupShape.swift]
      - Tafs/Services/HoldNotification.swift
      # The lost-key words name this device's Face ID or Touch ID (KIFFClient.approvalKeyLost).
      - Tafs/Services/BiometryName.swift
      # The app's words: Model and KIFF read them, and the extension's own bundle needs the catalog.
      - Tafs/Design/Words.swift
      # The age table the welcome's age line reads (Onboarding.ageLine, in Model).
      - Tafs/Design/MinimumAge.swift
      - Tafs/Localizable.xcstrings
    dependencies:
      - package: swift-secp256k1
        product: libsecp256k1
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: tafs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Notify/TafsNotify.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)bot.tafs.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.tafs.app.notify
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Notify/TafsNotifyMac.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(TAFS_PROFILE_NOTIFY)
        TARGETED_DEVICE_FAMILY: "1,2"
  TafsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TafsTests
      # The App Store's products for StoreKit's local testing (StoreKitLocalTests).
      - path: Tafs.storekit
        buildPhase: resources
    dependencies:
      - target: Tafs
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # The owner's 845 test, pinned on a simulator: a sent message at the top at once, and the
  # work block under it (kiff/tafs#289).
  TafsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TafsUITests
    dependencies:
      - target: Tafs
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tafs
        # iPhone and iPad only: these tests press the Home button, which a Mac lacks.
        SUPPORTS_MACCATALYST: NO
  # tafs on Apple Watch (docs/watch-app.md): a watchOS app with a single target, a companion to
  # the iPhone app with no sign-in of its own. It draws the phone's words, so it compiles the
  # generated Words.swift and its catalog, as TafsNotify does. Built by the TafsWatch scheme
  # only: the phone's scheme (Tafs) doesn't build it, so the phone's jobs don't pay for it.
  TafsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - TafsWatch
      - WatchShared
      - Tafs/Design/Words.swift
      - Tafs/Localizable.xcstrings
    info:
      path: TafsWatch/Info.plist
      properties:
        CFBundleDisplayName: tafs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # A watch app with a single target, installed with the iPhone app it belongs to.
        WKApplication: true
        WKCompanionAppBundleIdentifier: bot.tafs.app
        # The complication's link (row 24, `ComplicationLink.ask`): Coach's home, listening.
        CFBundleURLTypes:
          - CFBundleURLName: bot.tafs.app.watchkitapp.complication
            CFBundleURLSchemes: [tafs-watch]
        # Asked only with WatchVoice.on (off): the watch's own recording, turned into text on the iPhone (row 44, A).
        NSMicrophoneUsageDescription: tafs records what you say to Coach and sends it to your iPhone, which turns it into text on the phone itself and then deletes it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.tafs.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        PROVISIONING_PROFILE_SPECIFIER: $(TAFS_PROFILE_WATCH)
    # The complication and Smart Stack widget (row 24), embedded in the watch app.
    dependencies:
      - target: TafsWatchWidgets
  # tafs on the watch face (row 24, step 1): "Ask tafs", which opens the app listening. It shows nothing of the account
  # and never asks the phone. Its bundle id and provisioning profile are registered by CI's testflight job (`asc-profiles`,
  # `TAFS_PROFILE_WATCH_WIDGETS`) on its first run with this target.
  TafsWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - TafsWatchWidgets
      - TafsWatch/ComplicationLink.swift
      - Tafs/Design/Words.swift
      - Tafs/Localizable.xcstrings
    info:
      path: TafsWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: tafs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.tafs.app.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTS_MACCATALYST: NO
        PROVISIONING_PROFILE_SPECIFIER: $(TAFS_PROFILE_WATCH_WIDGETS)
  TafsWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - TafsWatchTests
    dependencies:
      - target: TafsWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TafsWatch.app/TafsWatch
        BUNDLE_LOADER: $(TEST_HOST)
        SUPPORTS_MACCATALYST: NO
  # The watch's checks a simulator can show, as UI tests (docs/watch-app.md, "The demo phone"): the watch app as shipped,
  # on the demo phone (`-watch-demo`, `WatchDemo`), pressed and read with no Simulator app and no signed-in iPhone.
  TafsWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - TafsWatchUITests
    dependencies:
      - target: TafsWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TafsWatch
        SUPPORTS_MACCATALYST: NO
schemes:
  Tafs:
    build:
      targets:
        Tafs: all
        TafsTests: [test]
        TafsUITests: [test]
    # Run from Xcode, the App Store's products are this file's: Solo and the five packs,
    # with the same product ids as App Store Connect.
    run:
      storeKitConfiguration: Tafs.storekit
    test:
      targets: [TafsTests, TafsUITests]
      # StoreKit's local testing (StoreKitLocalTests): the test host's App Store is this file's.
      storeKitConfiguration: Tafs.storekit
  # The Mac build (docs/mac-app.md): the app and its unit tests, without the UI tests,
  # which are the iPhone's and iPad's.
  TafsMac:
    build:
      targets:
        Tafs: all
        TafsTests: [test]
    test:
      targets: [TafsTests]
      storeKitConfiguration: Tafs.storekit
  # The watch app and its tests (CI's watch job), apart from the phone's.
  TafsWatch:
    build:
      targets:
        TafsWatch: all
        TafsWatchWidgets: all
        TafsWatchTests: [test]
        TafsWatchUITests: [test]
    test:
      targets: [TafsWatchTests, TafsWatchUITests]
