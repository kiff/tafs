name: iOS

# Every push and pull request: build and run the tests on a simulator, and,
# when the change touches the app's screens, take screenshots.
# A version tag (v0.1.0) or a manual run: also archive, sign and upload to
# TestFlight. Internal testers ("Team") get it at once; it also goes to the
# external group "Beta testers", after Apple's Beta App Review, unless a manual
# run sets external to false. Its testers
# are the BETA_TESTERS secret (this repository's logs are public).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      external:
        description: Also give the build to the external Beta testers (after Apple's review). Off keeps it to Team.
        type: boolean
        default: true

# A pull request's runs share one group, so a newer push cancels the older run.
# Every other run (main, tags, TestFlight builds) has a group of its own, keyed
# by its run id: GitHub replaces a pending run when another joins its group, so
# a shared group would drop runs even without cancel-in-progress.
concurrency:
  group: ios-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the screens could look different: screenshots cost a macOS runner,
  # so they run only for a change to the app's screens, or when asked by hand.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.diff.outputs.ui }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # What draws the screens: the views, the design system, the assets,
          # the root (TafsApp.swift: tab bar, navigation, onboarding, color
          # scheme), the mascot. And this workflow itself.
          ui='^(ios/Tafs/(Views|Design|Assets\.xcassets)/|ios/Tafs/App/TafsApp\.swift$|ios/Shared/Mascot\.xcassets/|\.github/workflows/ios\.yml$)'
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "ui=true" >> "$GITHUB_OUTPUT"   # asked by hand, or nothing to compare with
          elif git diff --name-only "$BASE" "$HEAD" | grep -Eq "$ui"; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The TestFlight job doesn't run on pull requests, so its Beta testers
      # step is tested here, against canned App Store Connect answers.
      - name: Test the Beta testers script
        run: ruby ios/scripts/test_asc_beta.rb

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Test on a simulator
        run: |
          cd ios
          xcodebuild -version
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted(k for k in devices if "iOS" in k)
          # The App Store iPhone size (kiff/tafs#185): a Pro Max, 6.9-inch, when there is one.
          iphones = [d for d in devices[ios[-1]] if d["name"].startswith("iPhone")]
          print(next((d for d in iphones if "Pro Max" in d["name"]), iphones[0])["udid"])
          ')
          xcodebuild test \
            -project Tafs.xcodeproj -scheme Tafs \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO

  # The Mac app (kiff/tafs#85): built for macOS 12, the owner's Mac's last system, so a
  # call to anything newer without a fallback fails here.
  mac:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build the Mac app
        run: |
          cd ios
          xcodebuild build -project Tafs.xcodeproj -scheme TafsMac \
            -destination "platform=macOS" CODE_SIGNING_ALLOWED=NO

  screenshots:
    needs: [changes, test]
    if: needs.changes.outputs.ui == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Run the app and take screenshots
        run: |
          cd ios
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted(k for k in devices if "iOS" in k)
          print(next(d["udid"] for d in devices[ios[-1]] if d["name"].startswith("iPhone")))
          ')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcodebuild build -project Tafs.xcodeproj -scheme Tafs \
            -destination "id=$DEVICE_ID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/Tafs.app
          mkdir -p "$RUNNER_TEMP/shots"
          shoot() {
            name=$1; shift
            xcrun simctl launch "$DEVICE_ID" bot.tafs.app "$@"
            sleep 8
            xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/shots/$name.png"
            xcrun simctl terminate "$DEVICE_ID" bot.tafs.app || true
          }
          shoot 1-welcome
          shoot 2-tafs -screenshots YES -tab tafs
          shoot 3-needs-you -screenshots YES -tab needs-you
          shoot 4-record -screenshots YES -tab record
          shoot 5-taf -screenshots YES -tab tafs -screen taf
          shoot 6-new-taf -screenshots YES -tab tafs -screen new
          shoot 7-chat -screenshots YES -tab tafs -screen chat
          # The iPad (kiff/tafs#85): the sidebar beside the open taf. The largest iPad,
          # whose portrait width still fits the taf's second column.
          xcrun simctl shutdown "$DEVICE_ID" || true
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted(k for k in devices if "iOS" in k)
          ipads = [d for d in devices[ios[-1]] if d["name"].startswith("iPad")]
          print(next((d for d in ipads if "13-inch" in d["name"]), ipads[0])["udid"])
          ')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/Tafs.app
          shoot ipad-1-welcome
          # Needs you first: the first launch with sample data on a just-booted iPad can
          # take longer than a shot's 8 s, so a simple screen goes first.
          shoot ipad-3-needs-you -screenshots YES -tab needs-you
          shoot ipad-2-taf -screenshots YES -tab tafs -screen taf
          ls -la "$RUNNER_TEMP/shots"

      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots

  testflight:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          # Where Xcode's own tools look for the key, under the name they expect.
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      # Says whether Apple accepts the key, the key id and the issuer together,
      # before anything is built. Prints only Apple's answer, never the key.
      - name: Check the App Store Connect key
        run: |
          ruby -ropenssl -rjson -rbase64 -rnet/http -e '
            b64 = ->(s) { Base64.urlsafe_encode64(s, padding: false) }
            key = OpenSSL::PKey::EC.new(File.read(ENV["RUNNER_TEMP"] + "/AuthKey.p8"))
            now = Time.now.to_i
            head = b64.(JSON.generate(alg: "ES256", kid: ENV["ASC_KEY_ID"], typ: "JWT"))
            body = b64.(JSON.generate(iss: ENV["ASC_ISSUER_ID"], iat: now, exp: now + 600, aud: "appstoreconnect-v1"))
            der = key.sign(OpenSSL::Digest::SHA256.new, "#{head}.#{body}")
            asn = OpenSSL::ASN1.decode(der)
            sig = asn.value.map { |i| i.value.to_s(2).rjust(32, "\x00".b)[-32..] }.join
            jwt = "#{head}.#{body}.#{b64.(sig)}"
            uri = URI("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=bot.tafs.app&limit=1")
            req = Net::HTTP::Get.new(uri); req["Authorization"] = "Bearer #{jwt}"
            res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |h| h.request(req) }
            puts "App Store Connect answered #{res.code}"
            j = JSON.parse(res.body) rescue {}
            (j["errors"] || []).each { |e| puts "  #{e["code"]}: #{e["detail"]}" }
            (j["data"] || []).each { |a| puts "  app #{a.dig("attributes", "name")} (#{a.dig("attributes", "bundleId")})" }
            puts "  key id is #{ENV["ASC_KEY_ID"].to_s.length} characters, issuer #{ENV["ASC_ISSUER_ID"].to_s.length}"
            exit(res.code == "200" ? 0 : 1)
          '

      # Signed by us, not by Xcode's sign-in, which App Store Connect refuses
      # here ("Cannot verify client's JWT headers") although the key works with
      # its API. The distribution certificate lives in DIST_P12; the App Store
      # profiles are made and installed through the API (ios/scripts).
      - name: Import the distribution certificate
        env:
          DIST_P12: ${{ secrets.DIST_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          SERIAL=$(security find-certificate -c "Apple Distribution" -p "$KC" | openssl x509 -noout -serial | cut -d= -f2)
          echo "DIST_CERT_SERIAL=$SERIAL" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC" | sed 's/[0-9A-F]\{40\}/<hash>/'

      - name: Make and install the App Store profiles
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          ruby ios/scripts/asc-profiles.rb \
            bot.tafs.app+push="tafs App Store CI" \
            bot.tafs.app.widgets="tafs widgets App Store CI"

      - name: Archive
        run: |
          cd ios
          xcodebuild archive \
            -project Tafs.xcodeproj -scheme Tafs -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tafs.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            TAFS_PROFILE_APP="tafs App Store CI" \
            TAFS_PROFILE_WIDGETS="tafs widgets App Store CI" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing.keychain-db" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export the .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>bot.tafs.app</key><string>tafs App Store CI</string>
              <key>bot.tafs.app.widgets</key><string>tafs widgets App Store CI</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tafs.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app --type ios \
            --file "$(ls "$RUNNER_TEMP"/export/*.ipa)" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # External testers get a build only once it is added to their group and
      # Apple has reviewed it; Team gets it without either.
      - name: Give the build to Beta testers
        # A tag always goes to them; a manual run unless it says not to.
        if: github.event_name != 'workflow_dispatch' || inputs.external
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          TESTERS: ${{ secrets.BETA_TESTERS }}
          BETA_CONTACT: ${{ secrets.BETA_CONTACT }}
          BETA_FEEDBACK_EMAIL: ${{ secrets.BETA_FEEDBACK_EMAIL }}
        run: ruby ios/scripts/asc-beta.rb

      - name: Remove the key and the keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
