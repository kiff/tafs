name: iOS

# A pull request, once it's ready for review (a draft runs nothing here): the
# unit tests on a simulator; the iPhone's UI tests when the change touches the
# screens or the UI tests; the iPad's list tests when it touches the iPad's
# layout; and, when it touches the screens, a key set of screenshots (a few
# screens, light and dark), beside the tests. main: the same tests on the same
# rules, and no screenshots. Only a change to what the app
# is built from runs here (the paths below): a tafs cloud or Android merge
# doesn't wait for a macOS runner.
# A version tag (v0.1.0) or a manual run, which is how a release is built:
# the tests, the iPad's, the full set of screenshots for a tag, and then
# archive, sign and upload to TestFlight. A manual run skips whatever main
# already passed on a commit with the same app (changes.tested, ui,
# ipad_tested), so an upload can go straight to the archive; a tag runs
# everything. A manual run can pick the
# screenshots (none by default, key, full, languages) and leave the upload
# off. A screenshot run never runs beside a release build: it stops at once
# while another manual or tag run is queued or running. Internal testers ("Team") get it at once; it also goes to the
# external group "Beta testers", after Apple's Beta App Review, unless a manual
# run sets external to false. Its testers
# are the BETA_TESTERS secret (this repository's logs are public).

on:
  push:
    branches: [main]
    tags: ["v*"]
    # What the app is built from (the strings are generated into ios/). GitHub
    # doesn't apply paths to a tag push, so a tag always runs.
    paths: ["ios/**", "app/strings/**", "app/routes.json", "app/map/**", ".github/workflows/ios.yml"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only a change to the Apple app, its strings or this workflow: a change to
    # tafs cloud or to Android doesn't wait for a macOS runner.
    paths: ["ios/**", "app/strings/**", "app/routes.json", "app/map/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: Archive and upload to TestFlight. Off runs the tests and takes the screenshots only.
        type: boolean
        default: true
      screenshots:
        description: "Which screenshots: none, full (every screen, light, dark, largest text, iPad, landscape), key (a few screens, light and dark) or languages (the main screens in each of the eight languages). A screenshot run waits for an empty queue: it stops if another manual or tag run is queued or running."
        type: choice
        options: [none, full, key, languages]
        default: none
      external:
        description: Also give the build to the external Beta testers (after Apple's review). Off keeps it to Team.
        type: boolean
        default: true

# A pull request's runs share one group, so a newer push cancels the older run.
# Every other run (main, tags, TestFlight builds) has a group of its own, keyed
# by its run id: GitHub replaces a pending run when another joins its group, so
# a shared group would drop runs even without cancel-in-progress.
concurrency:
  group: ios-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The token reads the repo only; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  # What a run needs, from what it changes: the tests, the iPad's list tests
  # and the screenshots each cost a macOS runner. A pull request or a push to
  # main runs the iPad's only for its layout, and a pull request a key set of
  # screenshots only for the screens. A tag runs everything and the full set; a
  # manual run the screenshots it asks for. A manual upload skips the tests
  # (tested) and the iPad's when main already passed them on a commit whose
  # app is the same as this one's.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      ipad: ${{ steps.diff.outputs.ipad }}
      shots: ${{ steps.diff.outputs.shots }}
      # The iPhone's UI tests (TafsUITests): a manual run's from the lookup, else the diff's.
      ui: ${{ steps.tested.outputs.ui || steps.diff.outputs.ui }}
      # The route walk (RouteWalkUITests) beside the unit tests, when the UI tests aren't due.
      walk: ${{ steps.diff.outputs.walk }}
      tested: ${{ steps.tested.outputs.tested }}
      ipad_tested: ${{ steps.tested.outputs.ipad_tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHOTS: ${{ inputs.screenshots || 'full' }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # What the iPad's list and sidebar are drawn from: the split view,
          # the bar (a rail on the iPad), the list, the root, the tests
          # themselves. And this workflow.
          ipad='^(ios/Tafs/Views/(HomeSplitView|HomeView|TafsBar)\.swift$|ios/Tafs/App/TafsApp\.swift$|ios/TafsUITests/ListTapUITests\.swift$|\.github/workflows/ios\.yml$)'
          # What draws the screens: the views, the design system, the assets,
          # the root (TafsApp.swift), the mascot. And this workflow.
          ui='^(ios/Tafs/(Views|Design|Assets\.xcassets)/|ios/Tafs/App/TafsApp\.swift$|ios/Shared/Mascot\.xcassets/|\.github/workflows/ios\.yml$)'
          # What the iPhone's UI tests depend on: what draws the screens, and the UI tests.
          uitests='^(ios/Tafs/(Views|Design|Assets\.xcassets)/|ios/Tafs/App/TafsApp\.swift$|ios/Shared/Mascot\.xcassets/|ios/TafsUITests/|\.github/workflows/ios\.yml$)'
          # What the route walk (RouteWalkUITests) depends on besides the screens: AppModel's
          # open(route:) and its hook, the routes and the map. With the UI tests it always runs;
          # otherwise it runs beside the unit tests when one of these changes.
          walk='^(ios/Tafs/App/|ios/TafsUITests/RouteWalkUITests\.swift$|app/routes\.json$|app/map/)'
          case "$EVENT" in
            workflow_dispatch) echo "ipad=true" >> "$GITHUB_OUTPUT"; echo "ui=true" >> "$GITHUB_OUTPUT"; echo "walk=true" >> "$GITHUB_OUTPUT"; echo "shots=$SHOTS" >> "$GITHUB_OUTPUT"; exit 0 ;;
            push) case "$REF" in
                    refs/tags/v*) echo "ipad=true" >> "$GITHUB_OUTPUT"; echo "ui=true" >> "$GITHUB_OUTPUT"; echo "walk=true" >> "$GITHUB_OUTPUT"; echo "shots=full" >> "$GITHUB_OUTPUT"; exit 0 ;;
                  esac
                  # main: the iPad's and the iPhone's UI tests only when the push
                  # touches what they test, as on a pull request.
                  echo "shots=none" >> "$GITHUB_OUTPUT"
                  if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
                    echo "ipad=true" >> "$GITHUB_OUTPUT"; echo "ui=true" >> "$GITHUB_OUTPUT"; echo "walk=true" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  changed=$(git diff --name-only "$BASE" "$HEAD")
                  if echo "$changed" | grep -Eq "$ipad"; then echo "ipad=true" >> "$GITHUB_OUTPUT"; else echo "ipad=false" >> "$GITHUB_OUTPUT"; fi
                  if echo "$changed" | grep -Eq "$uitests"; then echo "ui=true" >> "$GITHUB_OUTPUT"; else echo "ui=false" >> "$GITHUB_OUTPUT"; fi
                  if echo "$changed" | grep -Eq "$walk"; then echo "walk=true" >> "$GITHUB_OUTPUT"; else echo "walk=false" >> "$GITHUB_OUTPUT"; fi
                  exit 0 ;;
          esac
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "ipad=true" >> "$GITHUB_OUTPUT"; echo "ui=true" >> "$GITHUB_OUTPUT"; echo "walk=true" >> "$GITHUB_OUTPUT"; echo "shots=key" >> "$GITHUB_OUTPUT"   # nothing to compare with
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if echo "$changed" | grep -Eq "$ipad"; then echo "ipad=true" >> "$GITHUB_OUTPUT"; else echo "ipad=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$changed" | grep -Eq "$uitests"; then echo "ui=true" >> "$GITHUB_OUTPUT"; else echo "ui=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$changed" | grep -Eq "$walk"; then echo "walk=true" >> "$GITHUB_OUTPUT"; else echo "walk=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$changed" | grep -Eq "$ui"; then echo "shots=key" >> "$GITHUB_OUTPUT"; else echo "shots=none" >> "$GITHUB_OUTPUT"; fi

      # A manual run (an upload, or screenshots): has main already passed what
      # it would test, on a commit with the same app? Then it's skipped, and an
      # upload goes straight to the archive. Each part on its own rule, the
      # rule main and pull requests use to decide when to run it:
      # - the unit tests (tested): no change since to what the app is built
      #   from (the push paths);
      # - the iPhone's UI tests (ui): no change since to what draws the screens
      #   or to the UI tests;
      # - the iPad's (ipad_tested): no change since to the iPad's layout.
      # Main's last 40 successful runs are looked at, newest first, each at an
      # ancestor of this commit. Anything not found runs; a tag runs everything.
      - id: tested
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.sha }}
          RUN: ${{ github.run_id }}
        run: |
          app='^(ios/|app/strings/|app/routes\.json$|app/map/|\.github/workflows/ios\.yml$)'
          uitests='^(ios/Tafs/(Views|Design|Assets\.xcassets)/|ios/Tafs/App/TafsApp\.swift$|ios/Shared/Mascot\.xcassets/|ios/TafsUITests/|\.github/workflows/ios\.yml$)'
          ipad='^(ios/Tafs/Views/(HomeSplitView|HomeView|TafsBar)\.swift$|ios/Tafs/App/TafsApp\.swift$|ios/TafsUITests/ListTapUITests\.swift$|\.github/workflows/ios\.yml$)'
          tested=false; ui_tested=false; ipad_tested=false
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?branch=main&status=success&per_page=40" \
            --jq ".workflow_runs[] | select(.id != $RUN) | \"\(.id) \(.head_sha)\"") || runs=""
          while read -r id sha; do
            [ -n "$id" ] || continue
            git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$sha" "$HEAD" || continue
            changed=$(git diff --name-only "$sha" "$HEAD")
            # Each job's outcome, and each step of test's: "Unit and UI tests on a
            # simulator" (and "Test on a simulator", its name before) ran both kinds.
            done=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
              --jq '.jobs[] | "\(.name)=\(.conclusion)", (select(.name == "test") | .steps[] | "step:\(.name)=\(.conclusion)")') || continue
            if [ "$tested" = false ] && echo "$done" | grep -qx 'test=success' \
               && echo "$done" | grep -qxE 'step:(Unit tests|Unit and UI tests|Test) on a simulator=success' && ! echo "$changed" | grep -Eq "$app"; then
              tested=true; echo "The unit tests passed on main in run $id at $sha, with the same app: they're skipped."
            fi
            if [ "$ui_tested" = false ] && echo "$done" | grep -qx 'test=success' \
               && echo "$done" | grep -qxE 'step:(UI tests|Unit and UI tests|Test) on a simulator=success' && ! echo "$changed" | grep -Eq "$uitests"; then
              ui_tested=true; echo "The iPhone's UI tests passed on main in run $id at $sha, with the same screens: they're skipped."
            fi
            if [ "$ipad_tested" = false ] && echo "$done" | grep -qx 'ipad=success' && ! echo "$changed" | grep -Eq "$ipad"; then
              ipad_tested=true; echo "The iPad's passed on main in run $id at $sha, with the same iPad layout: they're skipped."
            fi
            [ "$tested" = true ] && [ "$ui_tested" = true ] && [ "$ipad_tested" = true ] && break
          done <<< "$runs"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"; echo "ipad_tested=$ipad_tested" >> "$GITHUB_OUTPUT"
          if [ "$ui_tested" = true ]; then echo "ui=false" >> "$GITHUB_OUTPUT"; else echo "ui=true" >> "$GITHUB_OUTPUT"; fi

      # A screenshot run (a manual run that doesn't upload) never runs beside a
      # release build: while another manual or tag run is queued or running, it
      # stops here, before it takes a macOS runner. Dispatch it again then.
      - name: Wait for an empty queue (screenshot runs)
        if: github.event_name == 'workflow_dispatch' && !inputs.upload && inputs.screenshots != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
        run: |
          busy=$(for status in queued in_progress; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?status=$status&per_page=50" \
              --jq ".workflow_runs[] | select(.id != $RUN and (.event == \"workflow_dispatch\" or (.event == \"push\" and (.head_branch | startswith(\"v\"))))) | \"\(.run_number)\""
          done)
          if [ -n "$busy" ]; then
            echo "::error::Another manual or tag iOS run is queued or running (run $(echo $busy | tr ' ' ',')). A screenshot run waits for it: dispatch it again once it's through."
            exit 1
          fi

  # Built once, then the unit tests on every change to the app, and the
  # iPhone's UI tests only when what they test changes (changes.ui). A draft
  # runs nothing on macOS: the tests run once it's ready for review. A manual
  # run skips what main already passed with the same app (changes.tested, ui).
  test:
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.outputs.tested != 'true' || needs.changes.outputs.ui == 'true')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The TestFlight job doesn't run on pull requests, so its Beta testers
      # step is tested here, against canned App Store Connect answers.
      - name: Test the Beta testers script
        run: ruby ios/scripts/test_asc_beta.rb

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for testing
        run: |
          cd ios
          xcodebuild -version
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted(k for k in devices if "iOS" in k)
          # The App Store iPhone size (kiff/tafs#185): a Pro Max, 6.9-inch, when there is one.
          iphones = [d for d in devices[ios[-1]] if d["name"].startswith("iPhone")]
          print(next((d for d in iphones if "Pro Max" in d["name"]), iphones[0])["udid"])
          ')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcodebuild build-for-testing \
            -project Tafs.xcodeproj -scheme Tafs \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO

      # Both kinds in one run when both are due, so the app is installed and
      # launched once (two runs cost about two minutes more); otherwise only
      # the kind that's due. Each step's name says what passed, which a manual
      # run's lookup (changes.tested) reads.
      - name: Unit and UI tests on a simulator
        if: needs.changes.outputs.tested != 'true' && needs.changes.outputs.ui == 'true'
        run: |
          cd ios
          xcodebuild test-without-building \
            -project Tafs.xcodeproj -scheme Tafs \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO

      # With the route walk (RouteWalkUITests, one launch of the app: about two minutes)
      # when what it depends on changed (changes.walk); the UI tests' steps run it anyway.
      - name: Unit tests on a simulator
        if: needs.changes.outputs.tested != 'true' && needs.changes.outputs.ui != 'true'
        env:
          WALK: ${{ needs.changes.outputs.walk }}
        run: |
          cd ios
          walk=()
          if [ "$WALK" = true ]; then walk=(-only-testing:TafsUITests/RouteWalkUITests); fi
          xcodebuild test-without-building \
            -project Tafs.xcodeproj -scheme Tafs \
            -destination "id=$DEVICE_ID" \
            -only-testing:TafsTests "${walk[@]}" \
            CODE_SIGNING_ALLOWED=NO

      - name: UI tests on a simulator
        if: needs.changes.outputs.tested == 'true' && needs.changes.outputs.ui == 'true'
        run: |
          cd ios
          xcodebuild test-without-building \
            -project Tafs.xcodeproj -scheme Tafs \
            -destination "id=$DEVICE_ID" \
            -only-testing:TafsUITests \
            CODE_SIGNING_ALLOWED=NO

  # The iPad's sidebar (the 901 test): the list's UI tests on the 13-inch iPad, since the
  # iPhone's list pushes a taf instead. A job of its own, beside test, so neither runs past
  # its time. The tests run once; they run again only when the simulator failed to launch the
  # app or to turn it, and any other failure fails the job at once.
  ipad:
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.ipad == 'true' && needs.changes.outputs.ipad_tested != 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Test the tafs list on an iPad
        run: |
          set -o pipefail
          cd ios
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted(k for k in devices if "iOS" in k)
          ipads = [d for d in devices[ios[-1]] if d["name"].startswith("iPad")]
          print(next((d for d in ipads if "13-inch" in d["name"]), ipads[0])["udid"])
          ')
          # Booted before the tests start, so the first launch doesn't race the boot.
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          list() {
            xcodebuild test \
              -project Tafs.xcodeproj -scheme Tafs \
              -destination "id=$DEVICE_ID" \
              -only-testing:TafsUITests/ListTapUITests \
              -resultBundlePath "$RUNNER_TEMP/ipad-list-$1.xcresult" \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ipad-list-$1.log"
          }
          list 1 && exit 0
          # Only the simulator failing is tried again: a launch, or a turn to landscape it never
          # confirmed. Any other test error is a real failure.
          log="$RUNNER_TEMP/ipad-list-1.log"
          real() { awk '/\.swift:[0-9]+: error/ && !/Failed to launch|Failed to get background assertion|Failed to set device orientation/ { f = 1 } END { exit !f }' "$log"; }
          if grep -Eq "Failed to launch|Failed to set device orientation" "$log" && ! real; then
            echo "::warning::The iPad simulator failed to launch the app or to turn it; running the list tests once more."
            list 2
          else
            exit 1
          fi

      # What the iPad's screen showed, when its list test fails.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ipad-list-xcresult
          path: ${{ runner.temp }}/ipad-list-*.xcresult

  # They show the screens, they don't test them: they run beside the tests,
  # not after them. The full set for a release, a key set for a pull request
  # that changes the screens (changes.shots).
  screenshots:
    needs: changes
    if: needs.changes.outputs.shots != 'none' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Run the app and take screenshots
        env:
          SET: ${{ needs.changes.outputs.shots }}
        run: |
          cd ios
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted(k for k in devices if "iOS" in k)
          # The App Store iPhone size (kiff/tafs#185): a Pro Max, 6.9-inch, when there is one.
          iphones = [d for d in devices[ios[-1]] if d["name"].startswith("iPhone")]
          print(next((d for d in iphones if "Pro Max" in d["name"]), iphones[0])["udid"])
          ')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcodebuild build -project Tafs.xcodeproj -scheme Tafs \
            -destination "id=$DEVICE_ID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/Tafs.app
          mkdir -p "$RUNNER_TEMP/shots"
          # A shot is taken once the screen has drawn and settled (kiff/tafs#195): the frame
          # isn't nearly empty (a screen not drawn yet is the plain background: 121 KB on the
          # 13-inch iPad, while the sparsest real screen, a pack's, is 175 KB on the iPhone),
          # and two frames a second apart are within 0.5% of each other's size (a hold's
          # countdown still ticks). After 30 s it's taken as it is, with a warning naming it.
          shoot() {
            name=$1; shift
            out="$RUNNER_TEMP/shots/$name.png"
            frame="$RUNNER_TEMP/frame.png"
            xcrun simctl launch "$DEVICE_ID" bot.tafs.app "$@"
            sleep 3
            prev=0
            ready=""
            for _ in $(seq 30); do
              xcrun simctl io "$DEVICE_ID" screenshot "$frame" >/dev/null 2>&1
              size=$(wc -c < "$frame")
              if [ "$size" -gt 150000 ] && [ $(( (size - prev) * 200 )) -le "$size" ] && [ $(( (prev - size) * 200 )) -le "$size" ]; then
                ready=1; break
              fi
              prev=$size
              sleep 1
            done
            [ -n "$ready" ] || echo "::warning::$name: the screen hadn't drawn and settled after 30 s"
            mv "$frame" "$out"
            xcrun simctl terminate "$DEVICE_ID" bot.tafs.app || true
          }
          # The languages set: the main screens in each language the app ships, a line cut off
          # or left in English shows here. The app's language and region come from the launch
          # arguments, as a phone set to that language gives them. Each language starts from a
          # fresh install, so a permission asked in one doesn't hang over the next one's screens.
          if [ "$SET" = languages ]; then
            for lang in en de fr es it pt nl pl; do
              xcrun simctl uninstall "$DEVICE_ID" bot.tafs.app || true
              xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/Tafs.app
              region=$(echo "$lang" | tr a-z A-Z); [ "$lang" = en ] && region=US
              loc=(-AppleLanguages "($lang)" -AppleLocale "${lang}_${region}")
              shoot "$lang-1-welcome" "${loc[@]}"
              shoot "$lang-2-tafs" -screenshots YES -tab tafs "${loc[@]}"
              shoot "$lang-3-needs-you" -screenshots YES -tab needs-you "${loc[@]}"
              shoot "$lang-4-record" -screenshots YES -tab record "${loc[@]}"
              shoot "$lang-5-taf" -screenshots YES -tab tafs -screen taf "${loc[@]}"
              shoot "$lang-5b-cards" -screenshots YES -tab tafs -screen card "${loc[@]}"
              shoot "$lang-7-chat" -screenshots YES -tab tafs -screen chat "${loc[@]}"
              shoot "$lang-8-setup" -screenshots YES -tab tafs -screen setup "${loc[@]}"
              shoot "$lang-9-account" -screenshots YES -tab account "${loc[@]}"
              shoot "$lang-9b-alerts" -screenshots YES -tab account -screen alerts "${loc[@]}"
              shoot "$lang-iap-pack" -screenshots YES -screen buy-credits -pack vonk "${loc[@]}"
            done
            ls -la "$RUNNER_TEMP/shots"
            exit 0
          fi
          # The key set: the screens most changes touch, light and dark.
          if [ "$SET" = key ]; then
            shoot 2-tafs -screenshots YES -tab tafs
            shoot 5-taf -screenshots YES -tab tafs -screen taf
            shoot 8-setup -screenshots YES -tab tafs -screen setup
            shoot 9-account -screenshots YES -tab account
            xcrun simctl ui "$DEVICE_ID" appearance dark
            shoot dark-tab-tafs -screenshots YES -tab tafs
            shoot dark-taf -screenshots YES -tab tafs -screen taf
            shoot dark-setup -screenshots YES -tab tafs -screen setup
            shoot dark-tab-account -screenshots YES -tab account
            xcrun simctl ui "$DEVICE_ID" appearance light
            ls -la "$RUNNER_TEMP/shots"
            exit 0
          fi
          shoot 1-welcome
          shoot 2-tafs -screenshots YES -tab tafs
          shoot 3-needs-you -screenshots YES -tab needs-you
          shoot 4-record -screenshots YES -tab record
          shoot 5-taf -screenshots YES -tab tafs -screen taf
          shoot 5b-cards -screenshots YES -tab tafs -screen card
          shoot 7-chat -screenshots YES -tab tafs -screen chat
          # The taf layout: the bar's Account, and the taf's Setup with its two screens.
          shoot 8-setup -screenshots YES -tab tafs -screen setup
          shoot 8b-starts-when -screenshots YES -tab tafs -screen starts
          shoot 8c-results-go-to -screenshots YES -tab tafs -screen results
          shoot 9-account -screenshots YES -tab account
          shoot 9b-alerts -screenshots YES -tab account -screen alerts
          # Each product's purchase screen, for its review screenshot in App Store Connect:
          # Solo, and the Add credits screen with one pack at a time.
          shoot iap-solo -screenshots YES -screen solo
          for pack in pico vonk rayo forte maxi; do
            shoot "iap-pack-$pack" -screenshots YES -screen buy-credits -pack "$pack"
          done
          # The largest text size (kiff/tafs#210): text wraps, nothing cut off or overlapped.
          xcrun simctl ui "$DEVICE_ID" content_size accessibility-extra-extra-extra-large
          shoot ax-needs-you -screenshots YES -tab needs-you
          shoot ax-record -screenshots YES -tab record
          shoot ax-card -screenshots YES -tab tafs -screen card
          shoot ax-chat -screenshots YES -tab tafs -screen chat
          xcrun simctl ui "$DEVICE_ID" content_size large
          # Dark (the taf layout): the same screens in the phone's dark appearance.
          xcrun simctl ui "$DEVICE_ID" appearance dark
          shoot dark-alerts -screenshots YES -tab account -screen alerts
          for screen in "tafs" "needs-you" "record" "account"; do
            shoot "dark-tab-$screen" -screenshots YES -tab "$screen"
          done
          for screen in taf card chat setup starts results; do
            shoot "dark-$screen" -screenshots YES -tab tafs -screen "$screen"
          done
          xcrun simctl ui "$DEVICE_ID" appearance light
          # The iPad (kiff/tafs#85): the sidebar beside the open taf. The largest iPad,
          # whose portrait width still fits the taf's second column.
          xcrun simctl shutdown "$DEVICE_ID" || true
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted(k for k in devices if "iOS" in k)
          ipads = [d for d in devices[ios[-1]] if d["name"].startswith("iPad")]
          print(next((d for d in ipads if "13-inch" in d["name"]), ipads[0])["udid"])
          ')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/Tafs.app
          shoot ipad-1-welcome
          shoot ipad-3-needs-you -screenshots YES -tab needs-you
          # A narrow window, Slide Over's width (kiff/tafs#210).
          shoot ipad-narrow-tafs -screenshots YES -tab tafs -narrow YES
          shoot ipad-narrow-needs-you -screenshots YES -tab needs-you -narrow YES
          shoot ipad-narrow-chat -screenshots YES -tab tafs -screen chat -narrow YES
          shoot ipad-2-taf -screenshots YES -tab tafs -screen taf
          shoot ipad-8-setup -screenshots YES -tab tafs -screen setup
          shoot ipad-8b-starts-when -screenshots YES -tab tafs -screen starts
          shoot ipad-4-cards -screenshots YES -tab tafs -screen card
          shoot ipad-9-account -screenshots YES -tab account
          # Landscape, the iPad's alone (the iPhone is portrait): the app turns its window
          # itself (-landscape), as simctl can't.
          shoot ipad-land-tafs -screenshots YES -tab tafs -landscape YES
          shoot ipad-land-setup -screenshots YES -tab tafs -screen setup -landscape YES
          # The sidebar as a signed-in account has it: its screens, and Coach above the account.
          shoot ipad-signed-in -screenshots YES -tab tafs -signedIn YES
          shoot ipad-land-signed-in -screenshots YES -tab tafs -signedIn YES -landscape YES
          xcrun simctl ui "$DEVICE_ID" appearance dark
          shoot ipad-dark-tafs -screenshots YES -tab tafs
          shoot ipad-dark-setup -screenshots YES -tab tafs -screen setup
          shoot ipad-dark-land-taf -screenshots YES -tab tafs -screen taf -landscape YES
          shoot ipad-dark-signed-in -screenshots YES -tab tafs -signedIn YES
          shoot ipad-dark-land-signed-in -screenshots YES -tab tafs -signedIn YES -landscape YES
          xcrun simctl ui "$DEVICE_ID" appearance light
          ls -la "$RUNNER_TEMP/shots"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots

  # After the tests and the iPad's, or without them when main already passed
  # them with the same app (changes.tested, changes.ipad_tested). A tag never
  # skips them.
  testflight:
    needs: [changes, test, ipad]
    if: >-
      !cancelled()
      && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload))
      && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.changes.outputs.tested == 'true'))
      && (needs.ipad.result == 'success' || (needs.ipad.result == 'skipped' && needs.changes.outputs.ipad_tested == 'true'))
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          # Where Xcode's own tools look for the key, under the name they expect.
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      # Says whether Apple accepts the key, the key id and the issuer together,
      # before anything is built. Prints only Apple's answer, never the key.
      - name: Check the App Store Connect key
        run: |
          ruby -ropenssl -rjson -rbase64 -rnet/http -e '
            b64 = ->(s) { Base64.urlsafe_encode64(s, padding: false) }
            key = OpenSSL::PKey::EC.new(File.read(ENV["RUNNER_TEMP"] + "/AuthKey.p8"))
            now = Time.now.to_i
            head = b64.(JSON.generate(alg: "ES256", kid: ENV["ASC_KEY_ID"], typ: "JWT"))
            body = b64.(JSON.generate(iss: ENV["ASC_ISSUER_ID"], iat: now, exp: now + 600, aud: "appstoreconnect-v1"))
            der = key.sign(OpenSSL::Digest::SHA256.new, "#{head}.#{body}")
            asn = OpenSSL::ASN1.decode(der)
            sig = asn.value.map { |i| i.value.to_s(2).rjust(32, "\x00".b)[-32..] }.join
            jwt = "#{head}.#{body}.#{b64.(sig)}"
            uri = URI("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=bot.tafs.app&limit=1")
            req = Net::HTTP::Get.new(uri); req["Authorization"] = "Bearer #{jwt}"
            res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |h| h.request(req) }
            puts "App Store Connect answered #{res.code}"
            j = JSON.parse(res.body) rescue {}
            (j["errors"] || []).each { |e| puts "  #{e["code"]}: #{e["detail"]}" }
            (j["data"] || []).each { |a| puts "  app #{a.dig("attributes", "name")} (#{a.dig("attributes", "bundleId")})" }
            puts "  key id is #{ENV["ASC_KEY_ID"].to_s.length} characters, issuer #{ENV["ASC_ISSUER_ID"].to_s.length}"
            exit(res.code == "200" ? 0 : 1)
          '

      # Signed by us, not by Xcode's sign-in, which App Store Connect refuses
      # here ("Cannot verify client's JWT headers") although the key works with
      # its API. The distribution certificate lives in DIST_P12; the App Store
      # profiles are made and installed through the API (ios/scripts).
      - name: Import the distribution certificate
        env:
          DIST_P12: ${{ secrets.DIST_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          SERIAL=$(security find-certificate -c "Apple Distribution" -p "$KC" | openssl x509 -noout -serial | cut -d= -f2)
          echo "DIST_CERT_SERIAL=$SERIAL" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC" | sed 's/[0-9A-F]\{40\}/<hash>/'

      - name: Make and install the App Store profiles
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          ruby ios/scripts/asc-profiles.rb \
            bot.tafs.app+push+timesensitive="tafs App Store CI" \
            bot.tafs.app.widgets="tafs widgets App Store CI" \
            bot.tafs.app.notify="tafs notify App Store CI"

      - name: Archive
        run: |
          cd ios
          xcodebuild archive \
            -project Tafs.xcodeproj -scheme Tafs -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tafs.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            TAFS_PROFILE_APP="tafs App Store CI" \
            TAFS_PROFILE_WIDGETS="tafs widgets App Store CI" \
            TAFS_PROFILE_NOTIFY="tafs notify App Store CI" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing.keychain-db" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export the .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>bot.tafs.app</key><string>tafs App Store CI</string>
              <key>bot.tafs.app.widgets</key><string>tafs widgets App Store CI</string>
              <key>bot.tafs.app.notify</key><string>tafs notify App Store CI</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tafs.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app --type ios \
            --file "$(ls "$RUNNER_TEMP"/export/*.ipa)" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # External testers get a build only once it is added to their group and
      # Apple has reviewed it; Team gets it without either.
      - name: Give the build to Beta testers
        # A tag always goes to them; a manual run unless it says not to.
        if: github.event_name != 'workflow_dispatch' || inputs.external
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          TESTERS: ${{ secrets.BETA_TESTERS }}
          BETA_CONTACT: ${{ secrets.BETA_CONTACT }}
          BETA_FEEDBACK_EMAIL: ${{ secrets.BETA_FEEDBACK_EMAIL }}
        run: WHAT_TO_TEST="$(cat ios/WhatToTest.txt)" ruby ios/scripts/asc-beta.rb

      - name: Remove the key and the keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
