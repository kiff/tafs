name: References

# A private tracker is never named in this public repo: not in the tree, not
# in a pull request's added lines. The pattern is split so this file never
# matches it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: No private references
        run: |
          pattern='kiff-cloud''#|kiff/kiff''-cloud|[Tt]he ''PM\b'
          if git grep -nE "$pattern" -- .; then
            echo "::error::a private reference is in the tree: name the gap or describe it instead"; exit 1
          fi
          if [ -n "$BASE" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            if git diff "origin/$BASE" HEAD | grep -E '^\+' | grep -E "$pattern"; then
              echo "::error::a private reference is in this pull request's diff"; exit 1
            fi
          fi
        env:
          BASE: ${{ github.base_ref }}

  # The changelog entry is one file per pull request (changes/README.md), so
  # pull requests never conflict on CHANGELOG.md's first line.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The fold and the check's own tests
        run: python3 -W error -m unittest discover -s scripts -p 'test_changelog.py'
      - name: One fragment, CHANGELOG.md untouched
        env:
          BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.head_ref }}
        run: python3 scripts/changelog.py check --base "origin/$BASE" --branch "$BRANCH"
