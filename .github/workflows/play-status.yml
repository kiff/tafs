name: Play status

# Where tafs stands on Google Play, for the owner's release board: each track (production, internal, the watch's) with each
# release's name, status and version codes, and nothing else (android/play/play_status.py). Read only: it opens an edit,
# reads the tracks and deletes the edit unsaved, so nothing is uploaded, changed or sent for review. By hand, and twice a
# day beside the App Store's (store-status.yml).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,17 * * *"

permissions:
  contents: read

concurrency:
  group: play-status
  cancel-in-progress: false

jobs:
  status:
    # The Play token comes from the same workload identity as the uploads, in the same environment; it's read here, never
    # used to write.
    environment: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The guard, before any token exists: the reader never names Play's save call, and its tests pass.
      - name: The reader only reads
        run: |
          if grep -n "commit" play/play_status.py; then
            echo "::error::play/play_status.py names Play's save call: it must only read"
            exit 1
          fi
          python3 -m unittest play/test_play_status.py
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Play's tracks
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 play/play_status.py | tee -a "$GITHUB_STEP_SUMMARY"
