# Where the apps reach tafs cloud (app/hosts.json): each an HTTPS origin, and the iPad's and
# Android's own constants saying the same.
name: Hosts

on:
  push:
    branches: [main]
    paths: ["app/hosts.json", "app/test_hosts.py", "ios/Tafs/KIFF/TafsCloud.swift", "android/app/src/main/kotlin/bot/tafs/app/kiff/TafsCloud.kt", ".github/workflows/hosts.yml"]
  pull_request:
    paths: ["app/hosts.json", "app/test_hosts.py", "ios/Tafs/KIFF/TafsCloud.swift", "android/app/src/main/kotlin/bot/tafs/app/kiff/TafsCloud.kt", ".github/workflows/hosts.yml"]

permissions:
  contents: read

concurrency:
  group: hosts-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The hosts, and each app's constants
        run: python3 -W error -m unittest discover -s app -p test_hosts.py
