name: Runtime

# Every push and pull request: typecheck and test the runtime.
# Push to main: deploy tafs cloud's code (runtime/src/cloud) to AWS Lambda,
# through the tafs-github-deploy role that infra/aws.sh creates (no stored AWS
# keys). Every taf runs on kiff/agents, which holds the model key; tafs cloud
# holds none.

on:
  push:
    branches: [main]
    paths: ["runtime/**", "infra/**", ".github/workflows/runtime.yml"]
  pull_request:
    paths: ["runtime/**", "infra/**", ".github/workflows/runtime.yml"]

defaults:
  run:
    working-directory: runtime

# The token reads the repo only; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The tests run the TypeScript; Lambda runs the bundle. A bundle that can't load answers 502 to
      # every route, so it fails here, before main deploys it.
      - run: npm run bundle-loads

  deploy:
    needs: test
    # One deploy at a time, in order: two overlapping would each keep the other's half-deployed code as
    # "previous", and a rollback could undo the other's good deploy.
    concurrency:
      group: tafs-cloud-deploy
      cancel-in-progress: false
    # On once infra/aws.sh has run: set the repository variable TAFS_CLOUD=on.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TAFS_CLOUD == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci && npm run bundle
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # The account id stays out of this public repository.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1
      - name: Deploy tafs cloud, check it live, and put the old code back on a 5xx
        run: |
          set -euo pipefail
          # Both functions run the same code: tafs-cloud, and tafs-cloud-stream (#60),
          # in eu-west-1. The streaming function's URL is the one the apps call.
          FNS="tafs-cloud tafs-cloud-stream"
          STREAM_URL=$(grep -oE 'https://[a-z0-9]+\.lambda-url\.[a-z0-9-]+\.on\.aws' ../android/app/src/main/kotlin/bot/tafs/app/kiff/TafsCloud.kt | head -1 || true)
          if [ -z "$STREAM_URL" ]; then
            echo "::error::the streaming function's URL (DEFAULT_STREAM_URL) isn't in the Android app's TafsCloud.kt any more: nothing was deployed"; exit 1
          fi
          # The code each function runs now, kept to put back.
          for fn in $FNS; do
            curl -sfL "$(aws --region eu-west-1 lambda get-function --function-name "$fn" --query Code.Location --output text)" -o "previous-$fn.zip"
          done
          deploy() { # deploy new|previous: the new bundle, or the code each function ran before
            for fn in $FNS; do
              zip=lambda.zip; [ "$1" = previous ] && zip="previous-$fn.zip"
              # Each step returns on failure itself: called from an `if`, `set -e` doesn't apply inside.
              aws --region eu-west-1 lambda update-function-code --function-name "$fn" --zip-file "fileb://$zip" >/dev/null || return 1
              aws --region eu-west-1 lambda wait function-updated-v2 --function-name "$fn" || return 1
            done
          }
          # A route's status, tried 3 times over 20 s for a cold start: it passes when it's the one wanted.
          answers() { # answers <url> <test on $status>
            for _ in 1 2 3; do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1" || true)
              if eval "$2"; then echo "$1 answered $status"; return 0; fi
              sleep 5
            done
            echo "::error::$1 answered $status after the deploy"; return 1
          }
          # A deploy that fails part-way (one function updated, the other not) puts the previous code back on both.
          if ! deploy new; then
            echo "::error::the deploy failed part-way: putting the previous code back"
            deploy previous
            exit 1
          fi
          # An unsigned read is refused (401) by tafs cloud; the streaming function, which serves only its
          # streams, answers 404. Either way it loaded and answered: a 5xx, or nothing, means it didn't.
          if answers https://cloud.tafs.kiff.dev/v1/recipes '[ "$status" = 401 ]' && answers "$STREAM_URL/v1/recipes" '[ "$status" -ge 400 ] && [ "$status" -lt 500 ]'; then
            exit 0
          fi
          echo "::error::the new code didn't answer as it should: putting the previous code back"
          deploy previous
          answers https://cloud.tafs.kiff.dev/v1/recipes '[ "$status" = 401 ]' || true
          exit 1
