name: Mac TestFlight

# A signed Mac build (Mac Catalyst, docs/mac-app.md) uploaded to TestFlight for
# the team's testers only: no review submission, no external group. By hand only.
#
# The app is the iPhone's and iPad's (bot.tafs.app, universal purchase) and its
# notification extension, signed with the same Apple Distribution certificate as
# the iOS upload (DIST_P12); the package with the Mac Installer Distribution
# certificate (MAC_INSTALLER_P12). The Mac Catalyst App Store profiles are made
# and installed through the API (ios/scripts/asc-profiles.rb --mac). Prints names,
# ids and Apple's answers only, never a key, a certificate or a profile.

on:
  workflow_dispatch:

concurrency:
  group: mac-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: ${{ vars.CLOUD_MAC == 'on' && fromJSON(vars.CLOUD_MAC_RUNNER) || 'macos-26' }}
    timeout-minutes: 60
    # The signing secrets (DIST_P12, MAC_INSTALLER_P12, ASC_KEY_P8) are this environment's, which deploys
    # only from main and v* tags: a workflow pushed on another branch can't read them (docs/mac-app.md).
    environment: apple-release
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      # On the cloud Mac (CLOUD_MAC, docs/mac-app.md, "The cloud Mac"), a release build runs only from main: its runner
      # group admits only this workflow at main, and this stops anything else before a secret is read.
      - name: The cloud Mac builds only from main
        if: runner.environment == 'self-hosted' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::A self-hosted Mac builds only from main (docs/mac-app.md, The cloud Mac)"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Mac App Store build is made with the newest released Xcode 27 on the image (the macOS 27 SDK for Mac
      # Catalyst), not the image's default, as the iOS upload is. A runner without one stops here and lists the Xcodes it
      # has, before any key or certificate is touched, rather than uploading a build made with an older SDK.
      - name: Use the newest Xcode 27
        env:
          ON_RUNNER: ${{ runner.environment }}
        run: |
          echo "Xcodes on this runner:"; ls -d /Applications/Xcode*.app || true
          xcode=$({ ls -d /Applications/Xcode_27*.app 2>/dev/null || true; } | python3 -c '
          import re, sys
          found = [l.strip() for l in sys.stdin if l.strip() and not re.search(r"beta|rc|candidate", l, re.I)]
          version = lambda p: [int(n) for n in re.findall(r"\d+", p.rsplit("/", 1)[-1])]
          print(max(found, key=version) if found else "")
          ')
          [ -n "$xcode" ] || { echo "::error::No released Xcode 27 on this runner image: the Mac App Store build needs the macOS 27 SDK"; exit 1; }
          if [ "$ON_RUNNER" = "self-hosted" ]; then
            # The cloud Mac's job user has no sudo: this job's steps use that Xcode through DEVELOPER_DIR.
            echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="$xcode/Contents/Developer"
          else
            sudo xcode-select -s "$xcode/Contents/Developer"
          fi
          xcodebuild -version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version) ($(xcrun --sdk macosx --show-sdk-build-version)), iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Check the installer certificate is stored
        env:
          MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
        run: |
          if [ -z "$MAC_INSTALLER_P12" ]; then
            echo "::error::MAC_INSTALLER_P12 isn't set: the Mac Installer Distribution certificate is stored once, by an admin (docs/mac-app.md, Signing)"
            exit 1
          fi

      - name: Generate the Xcode project
        env:
          ON_RUNNER: ${{ runner.environment }}
        run: |
          if [ "$ON_RUNNER" = "self-hosted" ]; then
            # The cloud Mac's admin installs a pinned xcodegen before the job; its job user can't run brew.
            command -v xcodegen >/dev/null || { echo "::error::No xcodegen on this Mac: its admin installs a pinned one before the job"; exit 1; }
            xcodegen --version
          else
            brew install xcodegen
          fi
          cd ios && xcodegen generate

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          # Where altool looks for the key, under the name it expects.
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Import the two certificates
        env:
          DIST_P12: ${{ secrets.DIST_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$MAC_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$MAC_INSTALLER_P12_PASSWORD" -f pkcs12 -A -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/installer.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          SERIAL=$(security find-certificate -c "Apple Distribution" -p "$KC" | openssl x509 -noout -serial | cut -d= -f2)
          echo "DIST_CERT_SERIAL=$SERIAL" >> "$GITHUB_ENV"
          # The installer identity by its hash, as the export options name it: not a code-signing identity.
          INSTALLER=$(security find-identity -v "$KC" | grep -E '3rd Party Mac Developer Installer|Mac Installer Distribution' | head -1 | awk '{print $2}')
          if [ -z "$INSTALLER" ]; then echo "::error::MAC_INSTALLER_P12 holds no Mac Installer Distribution identity"; exit 1; fi
          echo "INSTALLER_IDENTITY=$INSTALLER" >> "$GITHUB_ENV"
          security find-identity -v "$KC" | sed 's/[0-9A-F]\{40\}/<hash>/'

      - name: Make and install the Mac App Store profiles
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          ruby ios/scripts/asc-profiles.rb --mac \
            bot.tafs.app+push+timesensitive+associateddomains="tafs Mac App Store CI" \
            bot.tafs.app.notify="tafs notify Mac App Store CI"

      - name: Archive
        run: |
          cd ios
          xcodebuild archive \
            -project Tafs.xcodeproj -scheme Tafs -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath "$RUNNER_TEMP/TafsMac.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            TAFS_PROFILE_APP="tafs Mac App Store CI" \
            TAFS_PROFILE_NOTIFY="tafs notify Mac App Store CI" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing.keychain-db" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export the package
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>$INSTALLER_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>bot.tafs.app</key><string>tafs Mac App Store CI</string>
              <key>bot.tafs.app.notify</key><string>tafs notify Mac App Store CI</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TafsMac.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      # The team's testers get a build once it's processed, with nothing more: it
      # goes to no external group and is never submitted for review.
      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app --type macos \
            --file "$(ls "$RUNNER_TEMP"/export/*.pkg)" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Mac build ${{ github.run_number }} uploaded"

      - name: Remove the key and the keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
