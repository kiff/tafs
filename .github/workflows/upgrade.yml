name: Upgrade
# Brings every running taf's definition up to what main builds (#69): its
# instructions, KIFF's skill, the model and its effort, from its next run.
#
# By hand only, and gated on the evals: kiff/agents' latest nightly eval must
# have passed, and the tafs commit it measured (its eval/tafs.ref) must hold
# the same definition sources as main. Otherwise a real run is refused; a dry
# run still says what would change. A taf is written only when its definition
# changed (a digest on its record), since each write costs its next run a
# fresh prompt cache.
#
# The log is public: it shows counts per outcome and job, and failures by kind
# (tafs cloud keeps the full messages in its own log), never an account or a
# taf.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only say what would change"
        type: boolean
        default: true
      rule_b_run:
        description: "The owner's rule B: the id of the latest full Eval run, red only on Coach's wording check (blank: the plain gate)"
        type: string
        default: ""
      owner_override:
        description: "Only with a named owner decision on the thread: \"<base Eval run id> <check run id> <touched run ids, comma-separated, or -> <reason>\" (blank: none)"
        type: string
        default: ""
      eval_report_only:
        description: "Only with the owner's go on the thread, before launch (until 28 Nov 2026): \"<the latest completed Eval run id> <reason>\", that run read as a report, not a gate (blank: the gate stands)"
        type: string
        default: ""
      # The Eval's backup run on AWS CodeBuild (kiff/agents' infra/codebuild), for when GitHub won't start eval.yml:
      # the build's id, read from CodeBuild's own record through a read-only role (the codebuild job below).
      codebuild_build:
        description: "The Eval's backup build on CodeBuild, \"agents-eval:<uuid>\", read instead of GitHub's latest Eval (blank: GitHub's)"
        type: string
        default: ""
permissions:
  contents: read
  id-token: write
concurrency:
  group: upgrade
  cancel-in-progress: false
jobs:
  # The backup Eval's record, when codebuild_build names one: CodeBuild's own, read through a read-only role that only
  # this environment's runs may take (eval-gate, main only). It counts only when the build ran as its project defines
  # it (.github/upgrade-codebuild.sh, tested on saved records in upgrade-gate.yml), is the project's newest, started
  # after the latest Eval on GitHub, and measured a commit on kiff/agents' main. Its own job, so the upgrade's role
  # below is taken as before.
  codebuild:
    if: github.ref == 'refs/heads/main' && vars.TAFS_CLOUD == 'on' && inputs.codebuild_build != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: eval-gate
    permissions:
      contents: read
      id-token: write
    outputs:
      agents_sha: ${{ steps.read.outputs.agents_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # The account id stays out of this public repository.
          role-to-assume: ${{ secrets.AWS_EVAL_GATE_ROLE }}
          aws-region: eu-west-1
      - name: The backup Eval ran as its project defines it, and passed
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ inputs.codebuild_build }}
          RULE_B_RUN: ${{ inputs.rule_b_run }}
          OWNER_OVERRIDE: ${{ inputs.owner_override }}
          EVAL_REPORT_ONLY: ${{ inputs.eval_report_only }}
        run: |
          set -euo pipefail
          [ -z "$RULE_B_RUN$OWNER_OVERRIDE$EVAL_REPORT_ONLY" ] || { echo "::error::codebuild_build goes alone, without rule_b_run, owner_override or eval_report_only"; exit 1; }
          [[ "$BUILD" =~ ^agents-eval:[0-9a-f-]{36}$ ]] || { echo "::error::codebuild_build is \"agents-eval:<uuid>\""; exit 1; }
          aws codebuild batch-get-projects --names agents-eval --query 'projects[0]' --output json > project.json
          aws codebuild batch-get-builds --ids "$BUILD" --query 'builds[0]' --output json > build.json
          newest=$(aws codebuild list-builds-for-project --project-name agents-eval --sort-order DESCENDING --query 'ids[0]' --output text)
          latest=$(gh api "repos/kiff/agents/actions/workflows/eval.yml/runs?branch=main&status=completed&per_page=1" --jq '.workflow_runs[0].created_at')
          sha=$(bash .github/upgrade-codebuild.sh project.json build.json "$newest" "$latest") || { echo "::error::$sha"; exit 1; }
          status=$(gh api "repos/kiff/agents/compare/$sha...main" --jq .status)
          case "$status" in identical|ahead) ;; *) echo "::error::the build measured kiff/agents@${sha:0:12}, which isn't on main ($status)"; exit 1 ;; esac
          echo "agents_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "The backup Eval on CodeBuild passed, as its project defines it, measuring kiff/agents@${sha:0:12}." | tee -a "$GITHUB_STEP_SUMMARY"
  upgrade:
    needs: codebuild
    # With codebuild_build, only once its job counted the build; without it, that job is skipped.
    if: >-
      always() && github.ref == 'refs/heads/main' && vars.TAFS_CLOUD == 'on' &&
      ((inputs.codebuild_build == '' && needs.codebuild.result == 'skipped') || (inputs.codebuild_build != '' && needs.codebuild.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The evals passed on what this rolls out
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RULE_B_RUN: ${{ inputs.rule_b_run }}
          OWNER_OVERRIDE: ${{ inputs.owner_override }}
          EVAL_REPORT_ONLY: ${{ inputs.eval_report_only }}
          CODEBUILD_SHA: ${{ needs.codebuild.outputs.agents_sha }}
        run: |
          set -euo pipefail
          # An Eval job's log, as GitHub serves it. Not through gh: its newer releases refuse a response holding the
          # terminal colours the Eval's log has ("contains terminal escape sequences"), which stopped the gate.
          joblog() { curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/kiff/agents/actions/jobs/$1/logs"; }
          run=$(gh api "repos/kiff/agents/actions/workflows/eval.yml/runs?branch=main&status=completed&per_page=1" --jq '.workflow_runs[0] | "\(.conclusion) \(.head_sha) \(.id)"')
          read -r conclusion agents_sha run_id <<<"$run"
          # The backup Eval, when the codebuild job counted it: its commit stands for the latest Eval's.
          if [ -n "$CODEBUILD_SHA" ]; then
            conclusion=success agents_sha=$CODEBUILD_SHA run_id=codebuild
          fi
          ref=$(gh api "repos/kiff/agents/contents/eval/tafs.ref?ref=$agents_sha" --jq .content | base64 -d | tr -d '[:space:]')
          echo "kiff/agents' latest nightly eval: $conclusion, measuring kiff/tafs@${ref:0:12}"
          git cat-file -e "$ref^{commit}"
          # The owner's rule B: that same latest run, red only where its log shows
          # Coach's wording check failing once in 3 runs, and nothing else
          # (.github/upgrade-rule-b.sh, tested on saved logs in upgrade-gate.yml).
          # What the log can't show, that no failing line claims more than a Card,
          # connection or KIFF holds, is read and confirmed on the thread before
          # a real run, as the owner set.
          if [ -n "$RULE_B_RUN" ]; then
            [[ "$RULE_B_RUN" =~ ^[0-9]+$ ]] || { echo "::error::rule_b_run is an Eval run's id"; exit 1; }
            [ "$RULE_B_RUN" = "$run_id" ] || { echo "::error::rule_b_run $RULE_B_RUN isn't the latest completed Eval on main ($run_id)"; exit 1; }
            if [ "$conclusion" = failure ]; then
              job=$(gh api "repos/kiff/agents/actions/runs/$run_id/jobs" --jq '.jobs | if length == 1 then .[0] else error("not one job") end')
              jq -r '.steps[] | "\(.number) \(.conclusion) \(.name)"' <<<"$job" > eval.steps
              joblog "$(jq .id <<<"$job")" > eval.log
              bash .github/upgrade-rule-b.sh eval.log eval.steps && conclusion=success
            fi
          fi
          # The definition sources: what an Eval measures and the Upgrade rolls out.
          sources="runtime/src/jobs.ts runtime/src/kiff-skill.ts runtime/skills runtime/src/cloud/tafdef.ts runtime/src/cloud/setupdef.ts"
          # The owner's override (.github/upgrade-override.sh, tested on saved runs in upgrade-gate.yml): a full Eval red
          # in exactly one step; a later run of that step's suite at repeat 3 that passed it; and every suite the definitions
          # changed since touch, passed in that run or in a later run of them at the repeat the owner chose. Only with a named
          # owner decision on the thread; the runs, their tafs refs, each suite's repeat and the reason are this run's record.
          # One of the later runs is the latest Eval, and both are at its agents commit, so the definitions this rolls out
          # are their ref's (the sources check below).
          if [ -n "$OWNER_OVERRIDE" ]; then
            [ -z "$RULE_B_RUN" ] || { echo "::error::owner_override and rule_b_run are one or the other"; exit 1; }
            read -r base check touched reason <<<"$OWNER_OVERRIDE"
            # The touched runs: one, or several (a case one couldn't grade, run again alone), comma-separated.
            [[ "$base" =~ ^[0-9]+$ && "$check" =~ ^[0-9]+$ && ( "$touched" = - || "$touched" =~ ^[0-9]+(,[0-9]+)*$ ) && -n "$reason" && ${#reason} -le 200 ]] \
              || { echo "::error::owner_override is \"<base run id> <check run id> <touched run ids, comma-separated, or -> <reason>\""; exit 1; }
            [ "$check" = "$run_id" ] || [[ ",$touched," == *",$run_id,"* ]] \
              || { echo "::error::no later run is the latest completed Eval on main ($run_id)"; exit 1; }
            : > runs; : > touched.steps; : > touched.log
            tlogs=touched.log tsteps=touched.steps
            fetch() {
              local r=$1 id=$2 out=$3 info path branch status created sha job
              info=$(gh api "repos/kiff/agents/actions/runs/$id" --jq '"\(.path) \(.head_branch) \(.status) \(.created_at) \(.head_sha)"')
              read -r path branch status created sha <<<"$info"
              [ "$path" = .github/workflows/eval.yml ] && [ "$branch" = main ] && [ "$status" = completed ] \
                || { echo "::error::the $r run $id isn't a completed Eval on main"; exit 1; }
              echo "$r $id $created $sha" >> runs
              [ "$r" != base ] || base_sha=$sha
              job=$(gh api "repos/kiff/agents/actions/runs/$id/jobs" --jq '.jobs | if length == 1 then .[0] else error("not one job") end')
              jq -r '.steps[] | "\(.number) \(.conclusion) \(.name)"' <<<"$job" > "$out.steps"
              joblog "$(jq .id <<<"$job")" > "$out.log"
            }
            fetch base "$base" base
            fetch check "$check" check
            if [ "$touched" != - ]; then
              tlogs="" tsteps="" k=0
              for id in ${touched//,/ }; do
                k=$((k + 1))
                fetch touched "$id" "touched-$k"
                tlogs="$tlogs${tlogs:+,}touched-$k.log" tsteps="$tsteps${tsteps:+,}touched-$k.steps"
              done
            fi
            echo "shipped - - $agents_sha" >> runs
            # The definitions changed between the base and the check (a move lists both paths), and the suites they touch,
            # as kiff/agents maps them at the commit shipped.
            base_ref=$(gh api "repos/kiff/agents/contents/eval/tafs.ref?ref=$base_sha" --jq .content | base64 -d | tr -d '[:space:]')
            git cat-file -e "$base_ref^{commit}"
            git diff --no-renames --name-only "$base_ref" "$ref" -- $sources > changed.paths
            gh api "repos/kiff/agents/contents/eval/suites.json?ref=$agents_sha" --jq .content | base64 -d > suites.json
            out=$(bash .github/upgrade-override.sh runs base.steps base.log check.log check.steps "$tlogs" "$tsteps" suites.json changed.paths)
            conclusion=success
            { echo "Owner override: Eval $base (kiff/tafs@${base_ref:0:12}), red only in \"$(head -1 <<<"$out")\"; later runs at kiff/tafs@${ref:0:12}: $(sed -n 2p <<<"$out")."
              echo "Reason: $reason"; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # The owner's go before launch: the Eval is a report, not a gate. Its conclusion and run are this run's record; the
          # definitions rolled out must still be the ones it measured (the sources check below), so nothing unmeasured ships.
          # Bound as the decision is: the run it names (the latest completed Eval, as rule_b_run), and a date after which the gate
          # is a gate again without anyone removing this.
          if [ -n "$EVAL_REPORT_ONLY" ]; then
            [ -z "$RULE_B_RUN$OWNER_OVERRIDE" ] || { echo "::error::eval_report_only goes alone, without rule_b_run or owner_override"; exit 1; }
            [ "$(date -u +%Y%m%d)" -le 20261128 ] || { echo "::error::eval_report_only was the owner's pre-launch go; it has expired"; exit 1; }
            read -r named reason <<<"$EVAL_REPORT_ONLY"
            [[ "$named" =~ ^[0-9]+$ && -n "$reason" && ${#EVAL_REPORT_ONLY} -le 200 ]] \
              || { echo "::error::eval_report_only is \"<Eval run id> <reason>\", 200 characters at most"; exit 1; }
            [ "$named" = "$run_id" ] || { echo "::error::eval_report_only names $named, not the latest completed Eval on main ($run_id)"; exit 1; }
            echo "Eval as a report (the owner's go before launch): run $run_id concluded $conclusion. Reason: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
            conclusion=success
          fi
          if [ "$conclusion" = success ] && git diff --quiet "$ref" HEAD -- $sources; then
            echo "evaluated=true" >> "$GITHUB_OUTPUT"
          else
            echo "evaluated=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Not evaluated: the nightly didn't pass, or the definition sources changed since kiff/tafs@${ref:0:12}. Only a dry run goes ahead."
            git diff --stat "$ref" HEAD -- $sources || true
          fi
      - name: Refuse a real run that wasn't evaluated
        if: ${{ !inputs.dry_run && steps.gate.outputs.evaluated != 'true' }}
        run: |
          echo "::error::The evals haven't passed on these definitions. Move kiff/agents' eval/tafs.ref here and let the nightly pass, or run dry."
          exit 1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # The account id stays out of this public repository.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: eu-west-1
      - name: Upgrade the definitions
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          payload=$(jq -cn --argjson dry "$DRY_RUN" '{upgrade: {dry_run: $dry}}')
          aws lambda invoke --function-name tafs-cloud --cli-binary-format raw-in-base64-out \
            --payload "$payload" out.json >/dev/null
          if jq -e '.errorMessage' out.json >/dev/null; then
            echo "::error::$(jq -r .errorMessage out.json)"
            exit 1
          fi
          echo "dry run: $DRY_RUN"
          # Per job too: the nightly measures Chargebacks and Setup (kiff/agents#111's setup
          # case) only, so a change to another job's text shows here as that job's "would write".
          jq -r '.upgraded | group_by(.outcome) | map("\(.[0].outcome): \(length)" + (if .[0].outcome == "current" then "" else " (" + (group_by(.job) | map("\(.[0].job) \(length)") | join(", ")) + ")" end)) | .[]' out.json
          jq -r '.upgraded | map(select(.outcome == "failed")) | group_by(.error) | map("failed (\(length)), \(.[0].job): \(.[0].error | gsub("taf-[A-Za-z0-9]+"; "taf-…"))") | .[]' out.json
          if jq -e '.upgraded | any(.outcome == "failed")' out.json >/dev/null; then exit 1; fi
