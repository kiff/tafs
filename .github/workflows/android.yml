name: Android

# Every push and pull request that touches the Android app: build it and run its
# tests, then run the screens' UI tests on an emulator. Run by hand, or on a merge to main
# that raises versionCode, it also builds the signed release bundle for Play (the release
# job), with the upload key from Secrets Manager, and, once PLAY_UPLOAD is on, uploads it to
# Play's internal track with its release notes (play/play_internal.py; docs/android-app.md).

on:
  push:
    branches: [main]
    paths: ["android/**", "contracts/**", ".github/workflows/android.yml"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["android/**", "contracts/**", ".github/workflows/android.yml"]
  # The signed release bundle for Play, on demand (the release job).
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs share one group, so a newer push cancels the older run.
# Every other run has a group of its own, keyed by its run id.
concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: android

jobs:
  # The unit tests (the app's logic against a fake KIFF and tafs cloud, no phone), and a
  # debug build of the app and of its UI tests.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: chmod +x gradlew
      # The Android SDK is on the runner; its licences are accepted so Gradle can fetch
      # the platform the app compiles against.
      - name: Accept the SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      # Firebase's settings for dev.kiff.tafs, from the repository's secret: kept out of the repository,
      # as build.gradle.kts expects. Without the secret (a fork's pull request) the app builds with alerts off.
      - name: Firebase's settings
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
      - name: Unit tests and the debug builds
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      # The current versionCode's Play release notes, when there are any: all eight languages, each short enough.
      - name: Play release notes, and the upload's own tests
        run: |
          python3 play/play_internal.py --check
          python3 -m unittest play/test_play_internal.py
      # What the tests saw, when one fails.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-unit-test-results
          path: android/app/build/reports/tests

  # The screens' UI tests (the held call's card) on an emulator: KVM makes it fast enough.
  ui:
    # The emulator's tests wait for a pull request to be ready for review;
    # a draft gets the build and the unit tests only.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: chmod +x gradlew
      - name: Accept the SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-ui-test-results
          path: android/app/build/reports/androidTests

  # Whether this push to main raised versionCode: a release, built and sent to Play's internal track.
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      raised: ${{ steps.compare.outputs.raised }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: compare
        run: |
          set -euo pipefail
          code() { sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' | head -1; }
          now=$(code < app/build.gradle.kts)
          before=$(git show HEAD^:android/app/build.gradle.kts 2>/dev/null | code || true)
          echo "versionCode ${before:-none} -> $now"
          if [ -n "$before" ] && [ "$now" -gt "$before" ]; then echo "raised=true" >> "$GITHUB_OUTPUT"; else echo "raised=false" >> "$GITHUB_OUTPUT"; fi

  # The signed release bundle for Play's internal testing, by hand or on a merge to main that raised versionCode. The
  # upload key comes from Secrets Manager (the UPLOAD_KEY_SECRET_ID secret names it) through the deploy role, which may read
  # that one secret, and is written to the runner's temporary directory for the build only. The bundle is kept one day.
  release:
    # By hand, or on a merge to main that raised versionCode, once the tests and the UI tests passed.
    needs: [test, ui, version]
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.ui.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.version.outputs.raised == 'true')
    # The owner approves each release here; the release role trusts only this environment.
    environment: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: chmod +x gradlew
      - name: Accept the SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ANDROID_RELEASE_ROLE }}
          aws-region: eu-west-1
      - name: Firebase's settings
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || { echo "::error::GOOGLE_SERVICES_JSON is not set: a release needs alerts on"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: The signed bundle
        env:
          UPLOAD_KEY_SECRET_ID: ${{ secrets.UPLOAD_KEY_SECRET_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/upload.jks"
          secret=$(aws secretsmanager get-secret-value --secret-id "$UPLOAD_KEY_SECRET_ID" --query SecretString --output text)
          python3 -c 'import base64,json,sys; d=json.loads(sys.stdin.read()); open(sys.argv[1],"wb").write(base64.b64decode(d["keystore"]))' "$key" <<<"$secret"
          for f in store_password key_password alias; do
            v=$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read()).get(sys.argv[1], "upload"))' "$f" <<<"$secret")
            [ "$f" != alias ] && echo "::add-mask::$v"
            case $f in store_password) export TAFS_UPLOAD_STORE_PASSWORD="$v";; key_password) export TAFS_UPLOAD_KEY_PASSWORD="$v";; alias) export TAFS_UPLOAD_KEY_ALIAS="$v";; esac
          done
          unset secret
          TAFS_UPLOAD_KEYSTORE="$key" ./gradlew :app:bundleRelease --stacktrace
          rm -f "$key"
          # Signed with the upload key, or Play refuses it.
          "$JAVA_HOME/bin/jarsigner" -verify app/build/outputs/bundle/release/app-release.aab >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tafs-android-release-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 1
      # To Play's internal track, and only that track: signed in with Google's workload identity federation, a token that
      # lasts the run, for the Play Developer API alone. No key file, and no secret holds a key. Off until PLAY_UPLOAD is on.
      - id: google
        if: vars.PLAY_UPLOAD == 'on'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: To Play's internal track
        if: vars.PLAY_UPLOAD == 'on'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 play/play_internal.py --upload app/build/outputs/bundle/release/app-release.aab
