name: Android

# Every push and pull request that touches the Android app: build it and run its
# tests, then run the screens' UI tests on an emulator. The app is not shipped from
# here yet: signing, the Play Console and Play Billing come with their own setup.

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

# A pull request's runs share one group, so a newer push cancels the older run.
# Every other run has a group of its own, keyed by its run id.
concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: android

jobs:
  # The unit tests (the app's logic against a fake KIFF and tafs cloud, no phone), and a
  # debug build of the app and of its UI tests.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      # The Android SDK is on the runner; its licences are accepted so Gradle can fetch
      # the platform the app compiles against.
      - name: Accept the SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit tests and the debug builds
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      # What the tests saw, when one fails.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-unit-test-results
          path: android/app/build/reports/tests

  # The screens' UI tests (the held call's card) on an emulator: KVM makes it fast enough.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - name: Accept the SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-ui-test-results
          path: android/app/build/reports/androidTests
