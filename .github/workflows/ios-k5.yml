name: iOS K5

# K5, the end-to-end pass of row 39: the app's in-app sign-in and illustrated onboarding (ios/Tafs/Model/Onboarding.swift)
# on an iPhone simulator, walked by K5UITests with a screenshot kept at each step. Manual only. It never archives,
# signs or uploads.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Also the welcome in one more country (its region code, e.g. ID): its age line is kept as a screenshot. The test's own rows are IN, BR, CO (18), US and FR (16)."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-k5-${{ github.run_id }}

jobs:
  k5:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build
        run: |
          cd ios
          xcodebuild -version
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted(k for k in devices if "iOS" in k)
          iphones = [d for d in devices[ios[-1]] if d["name"].startswith("iPhone")]
          print(next((d for d in iphones if "Pro Max" in d["name"]), iphones[0])["udid"])
          ')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcodebuild build-for-testing \
            -project Tafs.xcodeproj -scheme Tafs \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO

      # TEST_RUNNER_K5 reaches the test runner as K5: K5UITests runs only with it.
      - name: K5 on a simulator
        env:
          TEST_RUNNER_K5: "1"
          TEST_RUNNER_K5_REGION: ${{ inputs.region }}
        run: |
          cd ios
          xcodebuild test-without-building \
            -project Tafs.xcodeproj -scheme Tafs \
            -destination "id=$DEVICE_ID" \
            -only-testing:TafsUITests/K5UITests \
            -resultBundlePath "$RUNNER_TEMP/k5.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: The screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/k5"
          if [ -d "$RUNNER_TEMP/k5.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/k5.xcresult" --output-path "$RUNNER_TEMP/k5"
          fi
          ls -la "$RUNNER_TEMP/k5"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: k5
          path: |
            ${{ runner.temp }}/k5
            ${{ runner.temp }}/k5.xcresult
