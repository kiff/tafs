# The apps' shared words (app/strings): the checks over them, and that every generated file is
# what the generator writes. Nobody edits a generated file by hand.
name: Strings

on:
  push:
    branches: [main]
    paths: ["app/strings/**", "docs/languages.md", "ios/Tafs/Localizable.xcstrings", "ios/Tafs/Design/Words.swift", "android/app/src/main/res/**", "android/app/src/main/kotlin/bot/tafs/app/model/Words.kt", ".github/workflows/strings.yml"]
  pull_request:
    paths: ["app/strings/**", "docs/languages.md", "ios/Tafs/Localizable.xcstrings", "ios/Tafs/Design/Words.swift", "android/app/src/main/res/**", "android/app/src/main/kotlin/bot/tafs/app/model/Words.kt", ".github/workflows/strings.yml"]

permissions:
  contents: read

jobs:
  strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The checks over the shared words
        run: python3 -W error -m unittest discover -s app/strings
      - name: The generated files are what the generator writes
        run: python3 app/strings/generate.py --check
