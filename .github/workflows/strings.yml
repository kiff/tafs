# The apps' shared words (app/strings): the checks over them, and that every generated file is
# what the generator writes. Nobody edits a generated file by hand. Any change to the iPhone and iPad
# app's sources, and to the Android app's, runs them too: English written in code fails them
# (app/strings/ios_literals.py, app/strings/android_literals.py).
name: Strings

on:
  push:
    branches: [main]
    paths: ["app/strings/**", "docs/languages.md", "ios/Tafs/**", "android/app/src/main/res/**", "android/app/src/main/kotlin/**", ".github/workflows/strings.yml"]
  pull_request:
    paths: ["app/strings/**", "docs/languages.md", "ios/Tafs/**", "android/app/src/main/res/**", "android/app/src/main/kotlin/**", ".github/workflows/strings.yml"]

permissions:
  contents: read

jobs:
  strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The checks over the shared words
        run: python3 -W error -m unittest discover -s app/strings
      - name: The generated files are what the generator writes
        run: python3 app/strings/generate.py --check
