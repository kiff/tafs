name: Mac release

# The Mac app (kiff/tafs#85) as a signed, notarized DMG: Developer ID, hardened
# runtime, stapled, so it opens on the owner's Mac (macOS 12) without Gatekeeper's
# warnings. A tag (mac-v0.1.0) attaches it to a GitHub release; a manual run keeps
# it as the run's artifact.
#
# Secrets: DEVELOPER_ID_P12 (base64) and DEVELOPER_ID_P12_PASSWORD, the Developer ID
# Application certificate and its key; notarization uses the App Store Connect key
# the TestFlight job already has (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8).

on:
  push:
    tags: ["mac-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: The Developer ID certificate, in a keychain of its own
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/devid.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$KC_PASS"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$DEVELOPER_ID_P12_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"
          security find-identity -v -p codesigning "$KC" | sed 's/[0-9A-F]\{40\}/<hash>/'

      - name: The App Store Connect key, for notarizing
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build and sign the app
        run: |
          cd ios
          xcodebuild archive \
            -project Tafs.xcodeproj -scheme TafsMac -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/TafsMac.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $RUNNER_TEMP/devid.keychain-db" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          APP="$RUNNER_TEMP/TafsMac.xcarchive/Products/Applications/TafsMac.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - --verbose=2 "$APP" 2>&1 | grep -E "Authority|flags|TeamIdentifier" || true

      - name: The DMG, signed
        run: |
          VERSION="${GITHUB_REF_NAME#mac-v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="build-${{ github.run_number }}"
          SRC="$RUNNER_TEMP/dmg"
          mkdir -p "$SRC"
          cp -R "$RUNNER_TEMP/TafsMac.xcarchive/Products/Applications/TafsMac.app" "$SRC/tafs.app"
          ln -s /Applications "$SRC/Applications"
          DMG="$RUNNER_TEMP/tafs-mac-$VERSION.dmg"
          hdiutil create -volname "tafs" -srcfolder "$SRC" -ov -format UDZO "$DMG"
          codesign --force --timestamp --sign "Developer ID Application" --keychain "$RUNNER_TEMP/devid.keychain-db" "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize and staple
        run: |
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Keep the DMG
        uses: actions/upload-artifact@v7
        with:
          name: tafs-mac
          path: ${{ env.DMG }}

      - name: Attach it to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" --title "tafs for Mac ${GITHUB_REF_NAME#mac-v}" \
            --notes "The Mac app, signed with Developer ID and notarized. Opens on macOS 12 and later. Approvals stay on the iPhone." \
            || gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/devid.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
