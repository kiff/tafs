name: Mac

# The Mac app (macOS 13 and later, docs/mac-app.md): the iPhone and iPad app
# built with Mac Catalyst. This builds it and runs the unit tests on a Mac.
#
# A macOS runner is scarce, so it runs only when it has to:
# - a pull request that changes what is specific to the Mac: the project, this
#   workflow, or a file that names the Mac build (macCatalyst, ThisDevice.isMac);
# - every night on main, which catches an iPhone or iPad change that stops the
#   Mac build compiling;
# - by hand.
# A draft pull request runs it too: a Mac build can't be checked on a machine
# without Xcode, so this is where a change to it is tried.

on:
  pull_request:
    paths: ["ios/**", "app/strings/**", ".github/workflows/mac.yml"]
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

concurrency:
  group: mac-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.diff.outputs.mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "mac=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The files that name the Mac build, as they are in this change.
          named=$(git grep -lE 'macCatalyst|ThisDevice\.isMac' -- ios || true)
          changed=$(git diff --name-only "$BASE" "$HEAD")
          mac=false
          if echo "$changed" | grep -Eq '^(ios/project\.yml|\.github/workflows/mac\.yml)$'; then mac=true; fi
          if [ -n "$named" ] && echo "$changed" | grep -Fxq -f <(echo "$named"); then mac=true; fi
          echo "mac=$mac" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      # Unsigned: the Mac's signing is set up at release. The linker still
      # signs the binary ad hoc, which is what lets the tests run it.
      - name: Build for the Mac
        run: |
          cd ios
          xcodebuild -version
          xcodebuild build-for-testing \
            -project Tafs.xcodeproj -scheme TafsMac \
            -destination "platform=macOS,variant=Mac Catalyst" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Unit tests on the Mac
        run: |
          cd ios
          xcodebuild test-without-building \
            -project Tafs.xcodeproj -scheme TafsMac \
            -destination "platform=macOS,variant=Mac Catalyst" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      # They show the Mac app, they don't test it: the whole screen, so the
      # menu bar is in the picture with the window. The iPad's reference set
      # (ios.yml, docs/screenshots/ipad/), light and dark, with the same launch
      # arguments, so each Mac screen can be laid beside its iPad one. Then the
      # Overview in French and Portuguese, for the menu bar's words.
      #
      # Every launch is in sample mode, which never asks the App Store. A
      # launch outside it (the welcome screen) starts listening for purchases,
      # and on a runner, which has no Apple Account, the App Store's sign-in
      # then covers the window for the launches after it.
      # TEMPORARY, removed before review: who raises the App Store's sign-in.
      - name: Diagnose the App Store sign-in
        continue-on-error: true
        run: |
          app="$PWD/ios/build/Build/Products/Debug-maccatalyst/Tafs.app"
          start=$(date "+%Y-%m-%d %H:%M:%S")
          open -n "$app" --args -screenshots YES -signedIn YES -tab tafs
          sleep 12
          echo "--- windows by process"
          osascript -e 'tell application "System Events" to get {name, (count windows)} of (every process whose background only is false)' || true
          osascript -e 'tell application "System Events" to get name of every process whose (count windows) > 0' || true
          echo "--- store and account processes"
          ps axo pid,ppid,comm | grep -iE "store|ams|akd|account|appleid" | grep -v grep || true
          echo "--- log"
          log show --start "$start" --style compact --predicate 'subsystem BEGINSWITH "com.apple.AppleMediaServices" OR subsystem BEGINSWITH "com.apple.storekit" OR subsystem BEGINSWITH "com.apple.commerce" OR process == "storeaccountd" OR process == "storekitagent" OR process == "appstoreagent" OR process == "Tafs"' 2>/dev/null | grep -iE "auth|sign|account|bundle|client|request|receipt|tafs" | head -150 || true
          pkill -x Tafs || true
          sleep 2

      - name: Run the Mac app and take screenshots
        run: |
          cd ios
          app="$PWD/build/Build/Products/Debug-maccatalyst/Tafs.app"
          mkdir -p "$RUNNER_TEMP/mac-shots"
          # Opened as a person opens it, so it's the front app and the menu bar
          # is its own. A shot is taken once two frames a second apart are
          # within 0.5% of each other's size; after 30 s, as it is, with a warning.
          shoot() {
            name=$1; shift
            frame="$RUNNER_TEMP/frame.png"
            open -n "$app" --args -screenshots YES -signedIn YES "$@"
            sleep 4
            prev=0
            ready=""
            for _ in $(seq 30); do
              screencapture -x "$frame"
              size=$(wc -c < "$frame")
              if [ $(( (size - prev) * 200 )) -le "$size" ] && [ $(( (prev - size) * 200 )) -le "$size" ]; then
                ready=1; break
              fi
              prev=$size
              sleep 1
            done
            [ -n "$ready" ] || echo "::warning::$name: the screen hadn't settled after 30 s"
            pgrep -x Tafs >/dev/null || echo "::warning::$name: the app wasn't running when the shot was taken"
            mv "$frame" "$RUNNER_TEMP/mac-shots/$name.png"
            pkill -x Tafs || true
            while pgrep -x Tafs >/dev/null; do sleep 0.5; done
          }
          en=(-AppleLanguages "(en)" -AppleLocale en_US)
          for look in Light Dark; do
            suffix=""; [ "$look" = Dark ] && suffix="-dark"
            ref() { local screen=$1; shift; shoot "$screen$suffix" "$@" -AppleInterfaceStyle "$look" "${en[@]}"; }
            ref overview -tab tafs
            ref needs-you -tab needs-you
            ref record -tab record
            ref calendar -tab tafs -screen calendar
            ref calendar-week -tab tafs -screen calendar-week
            ref account -tab account
            ref alerts -tab account -screen alerts
            ref taf -tab tafs -screen taf
            ref taf-card -tab tafs -screen card
            ref taf-chat -tab tafs -screen chat
            ref taf-setup -tab tafs -screen setup
            ref usage -tab tafs -screen usage
            ref connect-apps -tab tafs -screen connect-apps
            ref connect-app -tab tafs -screen connect-app
            ref devices -tab account -screen devices
            ref new-taf -tab tafs -screen new-taf
            ref coach -tab tafs -screen coach
            ref coach-chat -tab tafs -screen coach-chat
          done
          for lang in fr pt; do
            region=$(echo "$lang" | tr a-z A-Z)
            shoot "$lang-overview" -tab tafs -AppleLanguages "($lang)" -AppleLocale "${lang}_${region}"
          done
          ls -la "$RUNNER_TEMP/mac-shots"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-screenshots
          path: ${{ runner.temp }}/mac-shots
